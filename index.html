  --c1:#7C97FF;--c2:#D77BD0;--c3:#3FCDBB;--c4:#E3B84A;

<script>
(function(){
'use strict';

/* ---------- utilidades ---------- */
var $=function(s){return document.querySelector(s)};
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parseISO=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var todayISO=function(){return iso(new Date())};
var addDays=function(s,n){var d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)};
var weekStart=function(s){var d=parseISO(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)};
var mmss=function(s){return pad(Math.floor(s/60))+':'+pad(s%60)};
var fmt=function(m){m=Math.round(m);if(m<60)return m+' min';var h=Math.floor(m/60),r=m%60;return r?h+'h'+pad(r):h+'h'};
var sum=function(a,f){return a.reduce(function(x,t){return x+f(t)},0)};
var clone=function(o){return JSON.parse(JSON.stringify(o))};

var DAYS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
var DABR=['dom','seg','ter','qua','qui','sex','sáb'];
var MONS=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
var MONF=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var WIP=3, MAXMIT=3;

var CTX=[
  {id:'trabalho',name:'Trabalho',v:'--c1'},
  {id:'3coletivo',name:'3Coletivo',v:'--c2'},
  {id:'freelas',name:'Freelas',v:'--c3'},
  {id:'pessoal',name:'Pessoal',v:'--c4'}
];
var FW={
  pomodoro:{name:'Pomodoro',how:'25 minutos de foco total, 5 de pausa. A cada 4 rodadas, a pausa é de 15.',best:'Trabalho longo ou criativo'},
  timebox:{name:'Timebox',how:'O tempo da estimativa é o teto. Quando acabar, entregue o que tem e decida o próximo passo.',best:'Sem fim claro, risco de perfeccionismo'},
  cinco:{name:'Só 5 minutos',how:'Comece por 5 minutos e pode parar depois. Começar é a parte mais difícil.',best:'Tarefa que você vem adiando'},
  dois:{name:'Regra dos 2 minutos',how:'Se leva até 2 minutos, faça agora e tire da cabeça.',best:'Tarefas rápidas'}
};
var QD={
  1:{n:'Fazer agora',s:'Urgente e importante'},
  2:{n:'Agendar',s:'Importante, sem urgência'},
  3:{n:'Encurtar ou delegar',s:'Urgente, pouco importante'},
  4:{n:'Soltar ou deixar para depois',s:'Nem urgente nem importante'}
};

var ICON={
  target:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  timer:'<circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4.2l2.6 1.6M9.5 3h5"/>',
  bars:'<path d="M5.5 19V10M12 19V5M18.5 19v-6.5"/>',
  play:'<path d="M8.5 5.8v12.4l10-6.2z" fill="currentColor"/>',
  star:'<path d="M12 3.9l2.4 5 5.5.8-4 3.9.9 5.5-4.8-2.6-4.8 2.6.9-5.5-4-3.9 5.5-.8z"/>',
  check:'<path d="M5.5 12.5l4.2 4.2 8.8-9.2"/>',
  left:'<path d="M14.5 5.5L8 12l6.5 6.5"/>',
  right:'<path d="M9.5 5.5L16 12l-6.5 6.5"/>',
  pause:'<path d="M8.5 5.5v13M15.5 5.5v13"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  up:'<path d="M6 14l6-6 6 6"/>',
  down:'<path d="M6 10l6 6 6-6"/>',
  repeat:'<path d="M17 3l3 3-3 3M4 12v-2a4 4 0 0 1 4-4h12M7 21l-3-3 3-3M20 12v2a4 4 0 0 1-4 4H4"/>',
  more:'<circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/>',
  trash:'<path d="M4.5 7h15M9.5 7V4.8h5V7M6.5 7l.9 12.2h9.2L17.5 7M10 10.5v5.5M14 10.5v5.5"/>'
};
function ic(n,s,w){s=s||22;return '<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||1.9)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[n]+'</svg>'}

/* ---------- estado e persistencia ---------- */
var LS='prumo.v1';
function blank(){return {v:1,upd:0,owner:null,prof:{},seeded:false,tasks:[],rec:{},cap:[0,300,300,300,300,300,120],ctx:{},retro:{},blockers:{},log:{},days:{},g:{},session:null,u:{},dirty:{},del:{},synced:false}}
function readLocal(){try{var r=localStorage.getItem(LS);if(r){return Object.assign(blank(),JSON.parse(r))}}catch(e){}return blank()}
var S=readLocal();
function writeLocal(){if(wiped)return;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
// Apaga tudo que o app guardou neste aparelho (dados, preferências, retrôs vistas). Usado ao sair
// e ao trocar de conta, para que os dados de uma pessoa nunca fiquem para a próxima.
var wiped=false;
function wipeLocal(){wiped=true;try{Object.keys(localStorage).forEach(function(k){if(k.indexOf('prumo.')===0)localStorage.removeItem(k)})}catch(e){}}
var saveT=null,pushing=false,again=false,remote=null,sync='boot',booted=false;
function persist(){try{topUpRec()}catch(e){}S.upd=Date.now();try{timerSync();clearTimeout(remT);remT=setTimeout(remSync,2500)}catch(e){}if(SBCFG)stamp();writeLocal();clearTimeout(saveT);saveT=setTimeout(pushRemote,700);if(SBCFG)pushSoon(900)}
function setSync(s){sync=s;var e=$('#sync');if(e)e.textContent=syncText()}
function syncText(){
  if(sync==='ok')return 'Sincronizado com a sua conta.';
  if(sync==='err')return 'Não consegui sincronizar agora. Tento de novo na próxima alteração.';
  if(sync==='boot')return 'Conectando...';
  if(sync==='off')return 'Sem conexão. As alterações serão enviadas quando voltar.';
  if(sync==='out')return 'Você saiu da conta. Este aparelho não está sincronizando.';
  return 'Salvo só neste aparelho. Faça backup de vez em quando.';
}
function prune(days){
  var lim=Date.now()-days*864e5;
  // filhas de pautas antigas ficam até a conversão (convertPautas) registrar o que foi concluído
  S.tasks=S.tasks.filter(function(t){return t.parent||!(t.status==='done'&&t.doneAt&&t.doneAt<lim)});
  var keep=iso(new Date(Date.now()-400*864e5));
  Object.keys(S.log).forEach(function(k){if(k<keep)delete S.log[k]});
  Object.keys(S.days||{}).forEach(function(k){if(k<keep)delete S.days[k]});
}
async function pushRemote(){
  if(!remote)return;
  if(pushing){again=true;return}
  pushing=true;
  try{
    var data=Object.assign({},S,{session:null});
    if(JSON.stringify(data).length>230000){prune(60);data=Object.assign({},S,{session:null})}
    await remote.set(clone(data));
    setSync('ok');
  }catch(e){setSync('err')}
  pushing=false;
  if(again){again=false;pushRemote()}
}
function pristine(){return S.seeded&&S.tasks.length>0&&S.tasks.every(function(t){return t.ex})}
async function pullRemote(){
  if(!remote)return;
  try{
    var snap=await remote.get();
    var r=snap&&snap.exists?snap.data():null;
    if(r&&r.upd){
      if(r.upd>S.upd||(pristine()&&r.tasks&&r.tasks.length)){
        var keep=S.session;
        S=Object.assign(blank(),clone(r),{session:keep||null});
        writeLocal();setSync('ok');render();
      }else if(S.upd>r.upd){pushRemote()}
      else setSync('ok');
    }else if(S.upd){pushRemote()}
    else setSync('ok');
  }catch(e){setSync('err')}
}
async function initRemote(){
  if(SBCFG)return;
  try{
    if(!(window.claude&&window.claude.use)){setSync('local');return}
    var user=await window.claude.use('user');
    var db=await window.claude.use('db');
    if(!user||!db){setSync('local');return}
    var id=await user.id();
    if(!id){setSync('local');return}
    remote=db.collection('data/users/'+id).doc('prumo');
    await pullRemote();
  }catch(e){setSync('local')}
}

/* ---------- sincronizacao com o Supabase (so quando ha configuracao) ---------- */
var SBCFG=(window.PRUMO_SB&&window.supabase&&window.supabase.createClient)?window.PRUMO_SB:null;
var SB=null,SBU=null,sbChan=null,sbBusy=false,sbQ=0,sbT=null,sbPT=null,base={},pendRender=false;
function jstr(o){return JSON.stringify(o)}
function kindOf(k){return k.split('/')[0]}
function idOf(k){return k.slice(kindOf(k).length+1)}
function itemsOf(){
  var m={};
  S.tasks.forEach(function(t){m['task/'+t.id]=t});
  m['cap/cap']={cap:S.cap};
  m['ctx/ctx']=S.ctx||{};
  Object.keys(S.rec||{}).forEach(function(k){m['rec/'+k]=S.rec[k]});
  Object.keys(S.retro||{}).forEach(function(k){m['retro/'+k]=S.retro[k]});
  Object.keys(S.blockers||{}).forEach(function(k){m['blk/'+k]={t:S.blockers[k]}});
  Object.keys(S.log||{}).forEach(function(k){m['log/'+k]={s:S.log[k]}});
  Object.keys(S.days||{}).forEach(function(k){m['day/'+k]=S.days[k]});
  if(S.g&&Object.keys(S.g).length)m['cap/g']=S.g;
  if(S.prof&&(S.prof.name||S.prof.avk||S.prof.av))m['prof/me']=S.prof;
  return m;
}
function rebase(){base={};var m=itemsOf();Object.keys(m).forEach(function(k){base[k]=jstr(m[k])})}
function stamp(){
  var cur=itemsOf(),now=Date.now();
  Object.keys(cur).forEach(function(k){var s=jstr(cur[k]);if(base[k]!==s){base[k]=s;S.u[k]=now;S.dirty[k]=1;delete S.del[k]}});
  Object.keys(base).forEach(function(k){if(!(k in cur)){delete base[k];delete S.u[k];S.del[k]=now;S.dirty[k]=1}});
}
function applyItem(k,data){
  var kind=kindOf(k),id=idOf(k);
  if(kind==='task'){data.id=id;var i=S.tasks.findIndex(function(t){return t.id===id});if(i>=0)S.tasks[i]=data;else S.tasks.push(data)}
  else if(kind==='rec'){data.id=id;S.rec=S.rec||{};S.rec[id]=data}
  else if(kind==='cap'&&id==='g')S.g=cleanG(data);
  else if(kind==='day'){if(/^\d{4}-\d{2}-\d{2}$/.test(id)){S.days=S.days||{};S.days[id]=cleanDay(data)}}
  else if(kind==='cap'){if(Array.isArray(data.cap)&&data.cap.length===7)S.cap=data.cap}
  else if(kind==='ctx')S.ctx=data||{};
  else if(kind==='retro')S.retro[id]=data;
  else if(kind==='blk')S.blockers[id]=data.t;
  else if(kind==='log')S.log[id]=data.s;
  else if(kind==='prof'&&id==='me')S.prof={name:cleanName(data.name).trim(),avk:typeof data.avk==='string'?data.avk:'',av:Number(data.av)||0};
}
function dropItem(k){
  var kind=kindOf(k),id=idOf(k);
  if(kind==='task')S.tasks=S.tasks.filter(function(t){return t.id!==id});
  else if(kind==='rec'){if(S.rec)delete S.rec[id]}
  else if(kind==='retro')delete S.retro[id];
  else if(kind==='blk')delete S.blockers[id];
  else if(kind==='log')delete S.log[id];
  else if(kind==='day'){if(S.days)delete S.days[id]}
  else if(kind==='cap'&&id==='g')S.g={};
  else if(kind==='ctx')S.ctx={};
  else if(kind==='prof')S.prof={};
}
function mergeRemote(rows){
  var changed=false,rem={};
  rows.forEach(function(r){rem[r.kind+'/'+r.id]=r});
  if(!S.synced){
    if(rows.length)S.seeded=true;
    if(pristine()&&rows.length){S.tasks=[];S.dirty={};S.u={};S.del={};changed=true}
    S.synced=true;
  }
  var cur=itemsOf();
  Object.keys(rem).forEach(function(k){
    var r=rem[k],ru=Number(r.updated_at)||0,lt=Math.max(S.u[k]||0,S.del[k]||0);
    if(ru>lt){
      if(r.deleted){if(k in cur)changed=true;dropItem(k);delete S.u[k];delete S.dirty[k];S.del[k]=ru}
      else if(r.data&&typeof r.data==='object'){applyItem(k,r.data);S.u[k]=ru;delete S.del[k];delete S.dirty[k];changed=true}
    }
  });
  cur=itemsOf();
  Object.keys(cur).forEach(function(k){
    var r=rem[k];
    if(!r){S.u[k]=S.u[k]||((k==='cap/cap'||k==='ctx/ctx')?1:(S.upd||1));S.dirty[k]=1}
    else if((S.u[k]||0)>(Number(r.updated_at)||0))S.dirty[k]=1;
  });
  Object.keys(S.del).forEach(function(k){if(!rem[k]){delete S.del[k];delete S.dirty[k]}});
  try{if(topUpRec()){changed=true;stamp()}}catch(e){}
  return changed;
}
async function sbFetchAll(){
  var out=[],from=0,step=1000;
  for(;;){
    var r=await SB.from('prumo_items').select('kind,id,data,deleted,updated_at').order('kind').order('id').range(from,from+step-1);
    if(r.error)throw r.error;
    out=out.concat(r.data||[]);
    if(!r.data||r.data.length<step)break;
    from+=step;
  }
  return out;
}
async function sbPush(){
  var keys=Object.keys(S.dirty);if(!keys.length)return;
  var cur=itemsOf(),rows=[],sent={};
  keys.forEach(function(k){
    var row=null;
    if(k in cur)row={user_id:SBU,kind:kindOf(k),id:idOf(k),data:cur[k],deleted:false,updated_at:S.u[k]||S.upd||Date.now()};
    else if(S.del[k])row={user_id:SBU,kind:kindOf(k),id:idOf(k),data:{},deleted:true,updated_at:S.del[k]};
    if(row){rows.push(row);sent[k]=row.updated_at}else delete S.dirty[k];
  });
  for(var i=0;i<rows.length;i+=200){
    var r=await SB.from('prumo_items').upsert(rows.slice(i,i+200),{onConflict:'user_id,kind,id'});
    if(r&&r.error)throw r.error;
  }
  Object.keys(sent).forEach(function(k){var now=(S.u[k]||0)>(S.del[k]||0)?S.u[k]:S.del[k];if(now===sent[k])delete S.dirty[k]});
}
function softRender(){
  var a=document.activeElement;
  if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&$('#view').contains(a)){pendRender=true;return}
  render();
}
async function syncNow(pull){
  if(!SB||!SBU)return;
  if(sbBusy){sbQ=Math.max(sbQ,pull?2:1);return}
  sbBusy=true;
  try{
    if(navigator.onLine===false){setSync('off');return}
    var changed=false;
    if(pull||!S.synced){changed=mergeRemote(await sbFetchAll());rebase();if(convertPautas()){stamp();changed=true}}
    await sbPush();
    setSync('ok');writeLocal();
    if(changed)softRender();
  }catch(e){
    setSync(navigator.onLine===false?'off':'err');
    clearTimeout(sbT);sbT=setTimeout(function(){syncNow(true)},30000);
  }
  finally{sbBusy=false}
  if(sbQ){var q=sbQ;sbQ=0;syncNow(q===2)}
}
function pullSoon(ms){clearTimeout(sbT);sbT=setTimeout(function(){syncNow(true)},ms)}
function pushSoon(ms){clearTimeout(sbPT);sbPT=setTimeout(function(){syncNow(false)},ms)}
function subscribeRT(){
  if(sbChan||!SBU)return;
  try{sbChan=SB.channel('prumo-items').on('postgres_changes',{event:'*',schema:'public',table:'prumo_items',filter:'user_id=eq.'+SBU},function(){pullSoon(500)}).subscribe()}catch(e){}
}
function startSync(){setSync('boot');syncNow(true).then(subscribeRT);pushRefresh()}
function stopSync(){if(sbChan){try{SB.removeChannel(sbChan)}catch(e){}sbChan=null}setSync('out')}
// Sair: envia o que falta, desliga o push deste aparelho, encerra a sessão e apaga os dados locais.
// scope 'global' encerra a sessão em todos os aparelhos.
async function logout(scope){
  if(!SB)return;
  if(Object.keys(S.dirty).length&&navigator.onLine!==false){try{await Promise.race([syncNow(false),new Promise(function(r){setTimeout(r,5000)})])}catch(e){}}
  if(Object.keys(S.dirty).length&&!confirm('Há alterações que ainda não foram enviadas e serão perdidas neste aparelho. Sair mesmo assim?'))return;
  try{
    var reg=await Promise.race([navigator.serviceWorker.ready,new Promise(function(r){setTimeout(function(){r(null)},3000)})]);
    var sub=reg&&await reg.pushManager.getSubscription();
    if(sub){var ep=sub.endpoint;try{await SB.from('prumo_push_subs').delete().eq('endpoint',ep)}catch(e){}await sub.unsubscribe()}
  }catch(e){}
  stopSync();SBU=null;
  try{await SB.auth.signOut({scope:scope==='global'?'global':'local'})}catch(e){}
  wipeLocal();location.reload();
}
window.prumoLogout=logout;
function initSB(){
  if(!SBCFG)return false;
  try{SB=window.supabase.createClient(SBCFG.url,SBCFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}})}
  catch(e){SB=null;return false}
  window.prumoSB=SB;

/* ---------- obra: dia firme, sequência e andares ---------- */
// Dia firme: concluir tarefas e/ou blocos de 25 min de foco até a meta do dia (padrão 1).
// Folga (padrão sábado e domingo, mais dias com capacidade zero) não quebra a sequência; se for firme, vale tijolo.
// Uma pausa por semana cobre um dia útil em branco. A obra só cresce: cada semana com tijolo é um andar,
// e o andar fica "no prumo" quando a semana foi fechada na retrospectiva.
var FOCOBLK=25*60,OFFDEF=[0,6],PAUSAS=1;
function gOff(){var o=S.g&&S.g.off;return Array.isArray(o)?o.filter(function(x){return x>=0&&x<=6}):OFFDEF}
function gMeta(){var m=Number(S.g&&S.g.meta);return m>=1&&m<=5?Math.floor(m):1}
function isFolga(d){var w=parseISO(d).getDay();return gOff().indexOf(w)>=0||!(S.cap[w]>0)}
function doneMap(){var m={};S.tasks.forEach(function(t){if(isDone(t)&&t.doneAt){var d=iso(new Date(t.doneAt));m[d]=(m[d]||0)+1}});return m}
function dayUnits(d,dm){return ((dm||doneMap())[d]||0)+Math.floor((S.log[d]||0)/FOCOBLK)}
function dayOf(d){return (S.days&&S.days[d])||{}}
function dayClosed(d){return !!dayOf(d).c}
function retroDone(wk){var r=S.retro[wk];return !!(r&&(r.worked||r.stuck||r.tweak))}
// estado de cada dia desde a primeira atividade: f firme, o folga, p pausa usada, x em branco, t hoje ainda aberto
function obra(){
  var td=todayISO(),dm=doneMap(),meta=gMeta(),start=td;
  Object.keys(dm).concat(Object.keys(S.log||{}).filter(function(k){return S.log[k]>=FOCOBLK})).forEach(function(k){if(k<start)start=k});
  var lim=addDays(td,-400);if(start<lim)start=lim;
  var days=[],run=0,best=0,used={},bricks=0,d=start;
  while(d<=td){
    var u=dayUnits(d,dm),wk=weekStart(d),s;
    if(u>=meta){s='f';run++;bricks++;if(run>best)best=run}
    else if(d===td)s='t';
    else if(isFolga(d))s='o';
    else if((used[wk]||0)<PAUSAS){s='p';used[wk]=(used[wk]||0)+1}
    else{s='x';run=0}
    days.push({d:d,s:s,u:u});d=addDays(d,1);
  }
  var floors=[],by={};
  days.forEach(function(x){var wk=weekStart(x.d);if(!by[wk]){by[wk]={wk:wk,cells:['','','','','','',''],n:0};floors.push(by[wk])}var f=by[wk];f.cells[(parseISO(x.d).getDay()+6)%7]=x.s;if(x.s==='f')f.n++});
  floors=floors.filter(function(f){return f.n>0||f.wk===weekStart(td)});
  floors.forEach(function(f){f.prumo=retroDone(f.wk)});
  var last=days[days.length-1]||{u:0};
  return {cur:run,best:best,bricks:bricks,floors:floors,today:last.u,meta:meta,firm:last.u>=meta,pauseLeft:PAUSAS-(used[weekStart(td)]||0),broke:run===0&&best>0&&days.some(function(x){return x.s==='x'})};
}
function planned(d){return !!(S.blockers[d]||dayOf(d).s||tasksOn(d).length)}
// Sapo escolhido ao fechar o dia anterior, se ainda estiver aberto hoje
function sapoOf(d){var id=dayOf(d).s,t=id&&byId(id);return t&&!isDone(t)&&covers(t,d)?t:null}
function setDay(d,o){S.days=S.days||{};var cur=Object.assign({},S.days[d]||{},o);Object.keys(cur).forEach(function(k){if(cur[k]==null||cur[k]==='')delete cur[k]});if(Object.keys(cur).length)S.days[d]=cur;else delete S.days[d]}
// dados vindos da nuvem passam por aqui antes de entrar no estado
function cleanDay(o){o=o||{};var r={};if(Number(o.c)>0)r.c=Number(o.c);if(typeof o.s==='string'&&o.s.length<=64)r.s=o.s;return r}

var revMode='rev',dashRange='week';
function periodList(mode){
  var out=[],i,td=todayISO();
  if(mode==='week'){
    var w0=weekStart(td);
    for(i=7;i>=0;i--){var a=addDays(w0,-7*i);out.push({from:a,to:addDays(a,6),label:parseISO(a).getDate()+' '+MONS[parseISO(a).getMonth()],cur:i===0})}
  }else{
    var n=new Date();
    for(i=5;i>=0;i--){var d=new Date(n.getFullYear(),n.getMonth()-i,1),e=new Date(d.getFullYear(),d.getMonth()+1,0);
      out.push({from:iso(d),to:iso(e),label:MONS[d.getMonth()],cur:i===0})}
  }
  return out;
}
function periodStats(p,cut){
  var f=p.from,e=p.to,td=todayISO(),done=[],planned=0,slips=0,estSum=0,realSum=0,estReal=0,nReal=0;
  if(e>td)e=td;if(cut&&e>cut)e=cut; // só até hoje (ou até o corte), para comparar períodos de forma justa
  S.tasks.forEach(function(t){
    if(t.day&&t.day>=f&&t.day<=e){planned++;slips+=t.slips||0}
    if(isDone(t)&&t.doneAt){var dd=iso(new Date(t.doneAt));if(dd>=f&&dd<=e){
      done.push(t);var est=estAll(t,true);estSum+=est;
      if((t.focus||0)>=60){realSum+=t.focus/60;estReal+=est;nReal++}}}
  });
  var focus=0,d=f;while(d<=e){focus+=S.log[d]||0;d=addDays(d,1)}
  return {done:done.length,planned:planned,rate:planned?Math.round(done.length/planned*100):null,focus:focus/60,slips:slips,estSum:estSum,realSum:realSum,
    ratio:estReal?realSum/estReal:null,nReal:nReal};
}
function deltaHTML(cur,prev,unit,goodUp){
  if(prev==null||cur==null)return '';
  var d=cur-prev;if(Math.abs(d)<(unit==='min'?1:0.5))return '<small class="dl">igual ao anterior</small>';
  var up=d>0,good=goodUp?up:!up,txt=unit==='min'?(up?'+':'−')+fmt(Math.abs(d)):(up?'+':'−')+Math.round(Math.abs(d))+(unit==='pp'?' pp':'');
  return '<small class="dl" style="color:var('+(good?'--ok':'--warn')+')">'+txt+' vs. anterior</small>';
}
function barsHTML(ps,vals,fmtv,title){

    var v=vals[i],h=Math.max(v>0?4:0,Math.round(v/mx*100));
    return '<div class="bc"><span class="bv">'+(v>0?fmtv(v):'')+'</span><div class="bt"><i class="'+(p.cur?'cur':'')+'" style="height:'+h+'%"></i></div><span class="bl">'+esc(p.label)+'</span></div>'}).join('')+'</div>';

function calibText(r){
  if(r==null)return '';

  if(r>1.15)return 'Você costuma <b>subestimar</b>: leva cerca de '+Math.round(r*100)+'% do tempo que prevê.';

}

var EST_MAIN=[2,15,30,60,120,240],MAXSTEPS=30;
function chip(label,pressed,attrs,extra){return '<button class="chip" aria-pressed="'+pressed+'" '+attrs+'>'+(extra||'')+label+'</button>'}

/* reconhecimento de texto (pt-BR) */
var deacc=function(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()};
var WDN={dom:0,domingo:0,seg:1,segunda:1,ter:2,terca:2,qua:3,quarta:3,qui:4,quinta:4,sex:5,sexta:5,sab:6,sabado:6};
var DAYRX='(hoje|amanha|depois de amanha|(?:domingo|segunda|terca|quarta|quinta|sexta|sabado|dom|seg|ter|qua|qui|sex|sab)(?:-feira)?|\\d{1,2}/\\d{1,2})';
function resolveDay(w,from){
  var td=todayISO();w=w.replace(/-feira$/,'');
  if(w==='hoje')return td;if(w==='amanha')return addDays(td,1);if(w==='depois de amanha')return addDays(td,2);
  var m=w.match(/^(\d{1,2})\/(\d{1,2})$/);

function autoPlan(){
  var wk=curWk(),td=todayISO();

  if(!days.length){toast('Esta semana já passou. Vá para a próxima.');return}
  var load={};days.forEach(function(d){load[d]=sum(tasksOn(d),function(t){return t.est})});
  var cap=function(d){return S.cap[parseISO(d).getDay()]||0};
  var pool=S.tasks.filter(function(t){return !t.day&&!isDone(t)}).sort(function(a,b){return quad(a)-quad(b)||(b.slips||0)-(a.slips||0)||b.est-a.est});

/* ---------- conversão das antigas pautas (tarefa com filhas) ---------- */
// Plano por vários dias (sessões em dias seguidos) vira um período; entregas viram etapas.
// Nada se perde: foco e pomodoros somam na tarefa, o que já foi concluído fica marcado. Idempotente.
function kidsOf(id){return S.tasks.filter(function(c){return c.parent===id})}
function convertPautas(){
  var changed=false,ids={};S.tasks.forEach(function(t){ids[t.id]=1});
  S.tasks.forEach(function(t){if(t.parent&&!ids[t.parent]){delete t.parent;delete t.type;changed=true}});
  S.tasks.filter(function(g){return !g.parent&&S.tasks.some(function(c){return c.parent===g.id})}).forEach(function(g){
    var k=kidsOf(g.id).sort(function(a,b){return (a.day||'9')<(b.day||'9')?-1:((a.day||'9')>(b.day||'9')?1:(a.title<b.title?-1:1))});
    var days=k.map(function(c){return c.day}).filter(Boolean).filter(function(d,i,a){return a.indexOf(d)===i}).sort();
    var plan=days.length===k.length&&k.every(function(c){return c.type===g.title||/^Sess(ão|ao) \d+$/.test(c.title)});
    var nd=k.filter(isDone).length,all=nd===k.length,dod=(g.dod||[]).slice();
    if(plan){
      var cnt={};k.forEach(function(c){cnt[c.est]=(cnt[c.est]||0)+1});
      g.est=Number(Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]})[0])||g.est;
      if(nd&&!all)k.forEach(function(c){dod.push({t:'Sessão de '+shortDate(c.day),d:isDone(c)})});
    }else{
      k.forEach(function(c){dod.push({t:c.title,d:isDone(c)})});
      var tot=sum(k,function(c){return c.est||0});
      g.est=days.length>1?Math.max(5,Math.round(tot/days.length)):(tot||g.est);
    }
    g.day=days[0]||g.day||null;
    if(days.length>1)g.end=days[days.length-1];else delete g.end;
    g.dod=dod.slice(0,30);
    g.focus=(g.focus||0)+sum(k,function(c){return c.focus||0});
    g.pomos=(g.pomos||0)+sum(k,function(c){return c.pomos||0});
    if(all){g.status='done';g.doneAt=Math.max.apply(null,k.map(function(c){return c.doneAt||0}))||Date.now()}else if(g.status==='done'){g.status='todo';g.doneAt=null}
    if(S.session&&k.some(function(c){return c.id===S.session.tid}))S.session.tid=g.id;
    S.tasks=S.tasks.filter(function(c){return c.parent!==g.id});
    changed=true;
  });
  return changed;
}

// Reduz para 256 px e regrava a imagem: some tudo que vinha no arquivo original (inclusive a localização do GPS).
async function photoBlob(file){
  if(!file||!/^image\//.test(file.type||'image/'))throw 'tipo';
  if(file.size>20*1024*1024)throw 'grande';
  var img;
  try{img=await createImageBitmap(file)}

  var w=img.width,h=img.height;if(!w||!h||w>12000||h>12000)throw 'ler';
  var s=Math.min(w,h),c=document.createElement('canvas');c.width=c.height=256;
  var x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,(w-s)/2,(h-s)/2,s,s,0,0,256,256);
  if(img.close)img.close();
  var tb=function(t){return new Promise(function(ok){c.toBlob(ok,t,.85)})};
  var b=await tb('image/webp');if(!b||b.type!=='image/webp')b=await tb('image/jpeg');
  if(!b)throw 'ler';
  return b;
}

function wrAnim(root){

function wrapTarget(){

document.addEventListener('dragend',function(e){
  var r=e.target.closest&&e.target.closest('.row');if(r)r.classList.remove('dragging');
  dragId=null;clearOver();document.documentElement.classList.remove('dragmode');
});
document.addEventListener('dragover',function(e){
  if(!dragId)return;var t=dropTarget(e);if(!t)return;
  e.preventDefault();try{e.dataTransfer.dropEffect='move'}catch(x){}
  if(!t.classList.contains('drop-over')){clearOver();t.classList.add('drop-over')}
});
document.addEventListener('drop',function(e){
  if(!dragId)return;var t=dropTarget(e);if(!t)return;
  e.preventDefault();var id=dragId,d=dropDay(t),cur=byId(id);dragId=null;clearOver();document.documentElement.classList.remove('dragmode');
  if(!cur||(cur.day||null)===d)return;
  var was=moveTask(id,d);if(!was)return;
  render();toast('Movida para '+(d?relDay(d):'Sem data')+'.','Desfazer',function(){undoMove(id,was)});flashTask(id);
});
/* ---------- boot ---------- */
async function boot(){
  prune(400);S.rec=S.rec||{};
  initSB();
  rebase();
  rolloverRec();
  if(convertPautas())persist();
  initNav();
  if(S.session)tab='foco';
  render();
  var tw=null;
  try{tw=new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(1)},500)'],{type:'text/javascript'})));tw.onmessage=function(){tick()}}catch(e){tw=null}
  if(!tw)setInterval(tick,250);
  await Promise.race([initRemote(),new Promise(function(r){setTimeout(r,4500)})]);
  booted=true;
  if(!S.seeded&&!S.tasks.length)seed();
  render();
  tick();
  try{if(/[?&]retro=1/.test(location.search)){history.replaceState(null,'',location.pathname);wrOpen(weekStart(todayISO()))}}catch(e){}
  try{if(/[?&]fechar=1/.test(location.search)){history.replaceState(null,'',location.pathname);sh={kind:'close'};renderSheet()}}catch(e){}
  try{navigator.serviceWorker.addEventListener('message',function(e){if(e.data&&e.data.go==='retro')wrOpen(weekStart(todayISO()));if(e.data&&e.data.go==='fechar'){sh={kind:'close'};renderSheet()}})}catch(e){}
}
boot();
})();
</script>
<style>
#gate{position:fixed;inset:0;z-index:200;background:var(--bg);color:var(--ink);display:grid;place-items:center;overflow-y:auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));font-family:var(--body)}
#gate[hidden]{display:none!important}
#gate form{width:100%;max-width:380px;display:grid;gap:14px}
#gate #g-body{display:grid;gap:14px}
#gate .g-mark{width:44px;height:44px}
#gate h1{font:800 2.25rem/1.02 var(--display);letter-spacing:-.025em;margin:0}
#gate p{margin:0;color:var(--muted);font-size:.9375rem}
#gate p b{color:var(--ink);font-weight:600;word-break:break-all}
#gate .g-err{color:var(--bad);min-height:20px;font-size:.875rem}
#gate .g-err.ok{color:var(--muted)}
#gate .g-pw{position:relative}
#gate .g-pw .inp{padding-right:84px}
#gate .g-eye{position:absolute;right:6px;bottom:6px;height:36px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--muted);font:600 .8125rem var(--body);cursor:pointer}
#gate .g-eye:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#gate .g-hint{font-size:.8125rem;color:var(--muted);margin:6px 0 0}
#gate .g-code{font:500 1.5rem/1 var(--mono);letter-spacing:.3em;text-align:center}
#gate .g-links{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
#gate .g-link{border:0;background:none;padding:6px 0;color:var(--ink);font:600 .875rem var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
#gate .g-link:disabled{color:var(--muted);text-decoration:none;cursor:default}
#gate .g-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
/* alvos de toque de 44 px */
#gate .g-eye{height:44px;bottom:2px;right:2px}
#gate .g-link{min-height:44px;display:inline-flex;align-items:center}
</style>
<div id="gate" role="dialog" aria-modal="true" aria-labelledby="g-t" hidden>
  <form id="g-f" autocomplete="on" novalidate>
    <svg class="g-mark" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="6" r="2.2" fill="currentColor"/><path d="M22 6v20" stroke="currentColor" stroke-width="2"/><path d="M22 24l7 9-7 11-7-11z" fill="var(--accent)"/></svg>
    <h1 id="g-t">Prumo</h1>
    <div id="g-body"></div>
    <div class="g-err" id="g-e" role="alert" aria-live="assertive"></div>
    <button class="btn btn-p btn-full" id="g-b" type="submit">Entrar</button>
    <div class="g-links" id="g-l"></div>
  </form>
</div>
<script>
(function(){
'use strict';
var $g=function(id){return document.getElementById(id)};
var gate=$g('gate'),form=$g('g-f'),body=$g('g-body'),err=$g('g-e'),btn=$g('g-b'),links=$g('g-l');
var sb=window.prumoSB;
var APPURL=location.origin+location.pathname.replace(/index\.html$/,'');
var LOCKABLE=['.wrap','#tabs','#sheet','#toast','#mini'];
var view='in',email='',otp='',busy=false,fails=0,until=0,resendAt=0,resendT=null;

/* ---------- senha: regras locais e checagem de vazamento (k-anonimato) ---------- */
var PW_MIN=12,PW_MAXB=72;
function pwProblem(pw,mail){
  if(pw.length<PW_MIN)return 'Use pelo menos '+PW_MIN+' caracteres.';
  if(new TextEncoder().encode(pw).length>PW_MAXB)return 'Use no máximo 72 caracteres.';
  var lp=String(mail||'').split('@')[0].toLowerCase();
  if(lp.length>=4&&pw.toLowerCase().indexOf(lp)>=0)return 'Não use o seu e-mail na senha.';
  if(/^(.)\1+$/.test(pw))return 'Evite repetir o mesmo caractere.';
  return '';
}
// Só os 5 primeiros caracteres do SHA-1 saem do aparelho; a resposta vem com preenchimento.
// Se o serviço não responder, não bloqueia.
async function pwPwned(pw){
  try{
    var h=new Uint8Array(await crypto.subtle.digest('SHA-1',new TextEncoder().encode(pw)));
    var hex=Array.prototype.map.call(h,function(x){return x.toString(16).padStart(2,'0')}).join('').toUpperCase();
    var ctl=new AbortController(),t=setTimeout(function(){ctl.abort()},4000);
    var r=await fetch('https://api.pwnedpasswords.com/range/'+hex.slice(0,5),{headers:{'Add-Padding':'true'},signal:ctl.signal,credentials:'omit',referrerPolicy:'no-referrer'});
    clearTimeout(t);
    if(!r.ok)return false;
    var rest=hex.slice(5);
    return (await r.text()).split('\n').some(function(l){var p=l.trim().split(':');return p[0]===rest&&Number(p[1])>0});
  }catch(e){return false}
}
async function pwCheck(pw,pw2,mail){
  var p=pwProblem(pw,mail);if(p)return p;
  if(pw2!==undefined&&pw!==pw2)return 'As senhas não são iguais.';
  if(await pwPwned(pw))return 'Essa senha apareceu em vazamentos de dados. Escolha outra.';
  return '';
}
window.prumoPw={check:pwCheck,min:PW_MIN};

/* ---------- mensagens: genéricas para não revelar se um e-mail tem conta ---------- */
function msgOf(e){
  var c=(e&&(e.code||''))+'',m=(e&&(e.message||''))+'',st=e&&e.status;
  if(st===429||/rate_limit/.test(c))return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
  if(c==='invalid_credentials'||/invalid login/i.test(m))return 'E-mail ou senha incorretos.';
  if(c==='otp_expired'||/expired|invalid.*(otp|token)/i.test(m))return 'Código inválido ou expirado. Peça um novo.';
  if(c==='weak_password'||/weak|pwned/i.test(m))return 'Essa senha é fraca ou apareceu em vazamentos. Escolha outra.';
  if(c==='same_password')return 'Escolha uma senha diferente da atual.';
  if(c==='signup_disabled'||c==='unexpected_failure'||/database error saving new user/i.test(m))return 'Cadastro indisponível no momento.';
  if(/fetch|network|retryable/i.test(m+(e&&e.name)))return 'Sem conexão. Tente de novo.';
  return 'Não consegui concluir. Tente de novo.';
}
function say(t,ok){err.textContent=t||'';err.className='g-err'+(ok?' ok':'')}

/* ---------- telas ---------- */
function field(id,label,type,ac,extra){
  return '<div><label class="lab" for="'+id+'">'+label+'</label><input id="'+id+'" class="inp" type="'+type+'" autocomplete="'+ac+'" autocapitalize="none" autocorrect="off" spellcheck="false" '+(extra||'')+'></div>';
}
function pwField(id,label,ac,hint){
  return '<div class="g-pw"><label class="lab" for="'+id+'">'+label+'</label><input id="'+id+'" class="inp" type="password" autocomplete="'+ac+'" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="128"'+(hint?' aria-describedby="'+id+'-h"':'')+'>'+
    '<button type="button" class="g-eye" data-eye="'+id+'" aria-pressed="false" aria-label="Mostrar senha">Mostrar</button></div>'+(hint?'<p class="g-hint" id="'+id+'-h">'+hint+'</p>':'');
}
var EMAIL=function(){return field('g-em','E-mail','email','username','inputmode="email" maxlength="254"')};
var V={
  in:{t:'Entrar',b:'Entrar',p:'Entre com a sua conta para ver e sincronizar suas tarefas.',f:function(){return EMAIL()+pwField('g-pw','Senha','current-password')},
    l:[['up','Criar conta'],['forgot','Esqueci minha senha']]},
  up:{t:'Criar conta',b:'Criar conta',p:'Use um e-mail que você acessa: vamos mandar um código para confirmar.',
    f:function(){return EMAIL()+pwField('g-pw','Senha','new-password','Pelo menos '+PW_MIN+' caracteres. Uma frase longa funciona bem, ou deixe o gerenciador de senhas criar uma.')+pwField('g-pw2','Repita a senha','new-password')},
    l:[['in','Já tenho conta']]},
  forgot:{t:'Recuperar acesso',b:'Enviar código',p:'Informe o e-mail da conta. Se ele estiver cadastrado, você recebe um código para criar uma nova senha.',f:function(){return EMAIL()},l:[['in','Voltar']]},
  code:{t:'Confira seu e-mail',b:'Confirmar',p:'',f:function(){return field('g-code','Código','text','one-time-code','inputmode="numeric" maxlength="10" enterkeyhint="done"')},
    l:[['resend','Reenviar código'],['in','Voltar']]},
  newpw:{t:'Nova senha',b:'Salvar e entrar',p:'Crie uma nova senha para a sua conta. Os outros aparelhos conectados serão desconectados.',
    f:function(){return pwField('g-pw','Nova senha','new-password','Pelo menos '+PW_MIN+' caracteres.')+pwField('g-pw2','Repita a nova senha','new-password')},l:[]},
  wait:{t:'Prumo',b:'Aguarde',p:'Confirmando...',f:function(){return ''},l:[]}
};
function go(v,keepMsg){
  view=v;var d=V[v];
  $g('g-t').textContent=d.t;
  body.innerHTML='<p id="g-p"></p>'+d.f();
  var p=$g('g-p');
  if(v==='code'){
    p.appendChild(document.createTextNode(otp==='signup'?'Enviamos um código para ':'Se houver uma conta para '));
    var b=document.createElement('b');b.textContent=email;p.appendChild(b);
    p.appendChild(document.createTextNode(otp==='signup'?'. Digite o código ou toque no link do e-mail.':', enviamos um código. Digite-o abaixo.'));
  }else p.textContent=d.p;
  var c=$g('g-code');if(c)c.className='inp g-code';
  btn.textContent=d.b;btn.hidden=v==='wait';
  links.innerHTML=d.l.map(function(x){return '<button type="button" class="g-link" data-go="'+x[0]+'">'+x[1]+'</button>'}).join('');
  var em=$g('g-em');if(em&&email)em.value=email;
  if(!keepMsg)say('');
  tickResend();
  setTimeout(function(){var f=body.querySelector('input:not([value])')||body.querySelector('input');if(f&&!gate.hidden)f.focus()},50);
}
function tickResend(){
  clearTimeout(resendT);
  var b=links.querySelector('[data-go=resend]');if(!b)return;
  var s=Math.ceil((resendAt-Date.now())/1000);
  if(s>0){b.disabled=true;b.textContent='Reenviar em '+s+'s';resendT=setTimeout(tickResend,1000)}
  else{b.disabled=false;b.textContent='Reenviar código'}
}

/* ---------- mostrar/esconder ---------- */
function setInert(v){LOCKABLE.forEach(function(s){var e=document.querySelector(s);if(e){if(v)e.setAttribute('inert','');else e.removeAttribute('inert')}})}
function stored(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^sb-.*-auth-token$/.test(k)){var v=JSON.parse(localStorage.getItem(k));if(v&&v.refresh_token)return true}}}catch(e){}return false}
function unlock(){gate.hidden=true;setInert(false);body.innerHTML='';email='';otp=''}
function lock(v){gate.hidden=false;setInert(true);go(v||'in')}

/* ---------- ações ---------- */
function val(id){var e=$g(id);return e?e.value:''}
function readEmail(){var m=val('g-em').trim().toLowerCase();email=m;return m}
function okEmail(m){return m.length<=254&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)}
async function submit(){
  if(view==='in'){
    var m=readEmail(),pw=val('g-pw');
    if(!m||!pw)return say('Informe e-mail e senha.');
    var wait=until-Date.now();if(wait>0)return say('Aguarde '+Math.ceil(wait/1000)+'s para tentar de novo.');
    var r=await sb.auth.signInWithPassword({email:m,password:pw});
    if(!r.error){fails=0;unlock();return}
    if(r.error.code==='email_not_confirmed'){otp='signup';go('code');say('Confirme o e-mail antes de entrar. Se o código venceu, peça outro.',true);return}
    fails++;var m0=msgOf(r.error);
    if(fails>=3&&r.error.code==='invalid_credentials'){var w=Math.min(60,(fails-2)*5);until=Date.now()+w*1000;m0+=' Aguarde '+w+'s para tentar de novo.'}
    return say(m0);
  }
  if(view==='up'){
    var m2=readEmail(),a=val('g-pw'),b=val('g-pw2');
    if(!okEmail(m2))return say('Informe um e-mail válido.');
    var bad=await pwCheck(a,b,m2);if(bad)return say(bad);
    var r2=await sb.auth.signUp({email:m2,password:a,options:{emailRedirectTo:APPURL}});
    if(r2.error)return say(msgOf(r2.error));
    if(r2.data&&r2.data.session){unlock();return}
    otp='signup';resendAt=Date.now()+60000;go('code');return;
  }
  if(view==='forgot'){
    var m3=readEmail();if(!okEmail(m3))return say('Informe um e-mail válido.');
    var r3=await sb.auth.resetPasswordForEmail(m3,{redirectTo:APPURL});
    if(r3.error&&(r3.error.status===429||/rate_limit|fetch|network/i.test((r3.error.code||'')+r3.error.message)))return say(msgOf(r3.error));
    otp='recovery';resendAt=Date.now()+60000;go('code');return;
  }
  if(view==='code'){
    var tk=val('g-code').replace(/\D/g,'');
    if(tk.length<6)return say('Digite o código que chegou no e-mail.');
    var r4=await sb.auth.verifyOtp({email:email,token:tk,type:otp==='recovery'?'recovery':'email'});
    if(r4.error)return say(msgOf(r4.error));
    if(otp==='recovery')go('newpw');else unlock();
    return;
  }
  if(view==='newpw'){
    var n1=val('g-pw'),n2=val('g-pw2'),u=await sb.auth.getUser(),me=u&&u.data&&u.data.user?u.data.user.email:'';
    var bad2=await pwCheck(n1,n2,me);if(bad2)return say(bad2);
    var r5=await sb.auth.updateUser({password:n1});
    if(r5.error)return say(msgOf(r5.error));
    try{await sb.auth.signOut({scope:'others'})}catch(e){}
    unlock();return;
  }
}
async function resend(){
  if(Date.now()<resendAt)return;
  resendAt=Date.now()+60000;tickResend();
  var r=otp==='recovery'?await sb.auth.resetPasswordForEmail(email,{redirectTo:APPURL}):await sb.auth.resend({type:'signup',email:email,options:{emailRedirectTo:APPURL}});
  if(r.error&&(r.error.status===429||/rate_limit|fetch|network/i.test((r.error.code||'')+r.error.message)))say(msgOf(r.error));
  else say('Se o e-mail puder receber, um novo código foi enviado.',true);
}
form.addEventListener('submit',async function(e){
  e.preventDefault();
  if(busy)return;
  if(!sb){say('Não consegui carregar o login. Recarregue a página.');return}
  busy=true;btn.disabled=true;say('');
  try{await submit()}catch(x){say(msgOf(x))}
  busy=false;btn.disabled=false;
});
gate.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.eye){var i=$g(t.dataset.eye),sh=i.type==='password';i.type=sh?'text':'password';t.textContent=sh?'Ocultar':'Mostrar';t.setAttribute('aria-pressed',String(sh));t.setAttribute('aria-label',sh?'Ocultar senha':'Mostrar senha');return}
  if(t.dataset.go==='resend'){resend();return}
  if(t.dataset.go){var em=$g('g-em');if(em)email=em.value.trim().toLowerCase();go(t.dataset.go)}
});

/* ---------- links do e-mail: #token_hash=...&type=... (funciona em qualquer navegador) ---------- */
async function fromLink(){
  var q=new URLSearchParams(location.hash.slice(1));
  var th=q.get('token_hash'),ty=q.get('type'),er=q.get('error_description')||q.get('error');
  if(!th&&!er)return false;
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  if(er||!/^(email|signup|recovery)$/.test(ty||'')){lock('in');say('O link é inválido ou expirou. Entre com sua senha ou peça um novo código.');return true}
  lock('wait');
  var r=await sb.auth.verifyOtp({token_hash:th,type:ty==='signup'?'email':ty});
  if(r.error){go('in');say(msgOf(r.error)==='Código inválido ou expirado. Peça um novo.'?'O link é inválido ou expirou. Entre com sua senha ou peça um novo código.':msgOf(r.error));return true}
  if(ty==='recovery')go('newpw');else unlock();
  return true;
}

if(sb){
  sb.auth.onAuthStateChange(function(ev){
    if(ev==='SIGNED_OUT')lock('in');
    else if(ev==='PASSWORD_RECOVERY'){if(view!=='newpw')lock('newpw')}
    else if(ev==='SIGNED_IN'&&!gate.hidden&&view!=='newpw'&&!(view==='code'&&otp==='recovery'))unlock();
  });
}
if(sb&&/token_hash=|error=/.test(location.hash))fromLink();
else if(location.hash==='#conta-excluida'){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}lock('in');say('Sua conta foi excluída, com todos os dados. Obrigado por ter usado o Prumo.',true)}
else if(stored())unlock();
else lock('in');
})();
</script>

<script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
