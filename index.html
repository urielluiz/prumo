/* ---------- estado e persistencia ---------- */
var LS='prumo.v1';
function blank(){return {v:1,upd:0,seeded:false,tasks:[],cap:[0,300,300,300,300,300,120],ctx:{},retro:{},blockers:{},log:{},session:null,u:{},dirty:{},del:{},synced:false}}
function readLocal(){try{var r=localStorage.getItem(LS);if(r){return Object.assign(blank(),JSON.parse(r))}}catch(e){}return blank()}
var S=readLocal();
function writeLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
var saveT=null,pushing=false,again=false,remote=null,sync='boot',booted=false;
function kidsOf(id){return S.tasks.filter(function(c){return c.parent===id})}
function isGrp(t){return S.tasks.some(function(c){return c.parent===t.id})}
function fixGroups(){S.tasks.forEach(function(t){if(!isGrp(t))return;var k=kidsOf(t.id),all=k.every(function(c){return c.status==='done'});
  if(all&&t.status!=='done'){t.status='done';t.doneAt=Math.max.apply(null,k.map(function(c){return c.doneAt||0}))||Date.now()}
  else if(!all&&t.status==='done'){t.status='todo';t.doneAt=null}
  if(t.day)t.day=null;t.mit=false})}
function persist(){fixGroups();S.upd=Date.now();if(SBCFG)stamp();writeLocal();clearTimeout(saveT);saveT=setTimeout(pushRemote,700);if(SBCFG)pushSoon(900)}
function setSync(s){sync=s;var e=$('#sync');if(e)e.textContent=syncText()}
function syncText(){
  if(sync==='ok')return 'Sincronizado com a sua conta.';
  if(sync==='err')return 'Não consegui sincronizar agora. Tento de novo na próxima alteração.';
  if(sync==='boot')return 'Conectando...';
  if(sync==='off')return 'Sem conexão. As alterações serão enviadas quando voltar.';
  if(sync==='out')return 'Você saiu da conta. Este aparelho não está sincronizando.';
  return 'Salvo só neste aparelho. Faça backup de vez em quando.';
}
function prune(days){
  var lim=Date.now()-days*864e5;
  S.tasks=S.tasks.filter(function(t){return !(t.status==='done'&&t.doneAt&&t.doneAt<lim)});
  var keep=iso(new Date(Date.now()-400*864e5));
  Object.keys(S.log).forEach(function(k){if(k<keep)delete S.log[k]});
}
async function pushRemote(){
  if(!remote)return;
  if(pushing){again=true;return}
  pushing=true;
  try{
    var data=Object.assign({},S,{session:null});
    if(JSON.stringify(data).length>230000){prune(60);data=Object.assign({},S,{session:null})}
    await remote.set(clone(data));
    setSync('ok');
  }catch(e){setSync('err')}
  pushing=false;
  if(again){again=false;pushRemote()}
}
function pristine(){return S.seeded&&S.tasks.length>0&&S.tasks.every(function(t){return t.ex})}
async function pullRemote(){
  if(!remote)return;
  try{
    var snap=await remote.get();
    var r=snap&&snap.exists?snap.data():null;
    if(r&&r.upd){
      if(r.upd>S.upd||(pristine()&&r.tasks&&r.tasks.length)){
        var keep=S.session;
        S=Object.assign(blank(),clone(r),{session:keep||null});
        writeLocal();setSync('ok');render();
      }else if(S.upd>r.upd){pushRemote()}
      else setSync('ok');
    }else if(S.upd){pushRemote()}
    else setSync('ok');
  }catch(e){setSync('err')}
}
async function initRemote(){
  if(SBCFG)return;
  try{
    if(!(window.claude&&window.claude.use)){setSync('local');return}
    var user=await window.claude.use('user');
    var db=await window.claude.use('db');
    if(!user||!db){setSync('local');return}
    var id=await user.id();
    if(!id){setSync('local');return}
    remote=db.collection('data/users/'+id).doc('prumo');
    await pullRemote();
  }catch(e){setSync('local')}
}

/* ---------- sincronizacao com o Supabase (so quando ha configuracao) ---------- */
var SBCFG=(window.PRUMO_SB&&window.supabase&&window.supabase.createClient)?window.PRUMO_SB:null;
var SB=null,SBU=null,sbChan=null,sbBusy=false,sbQ=0,sbT=null,sbPT=null,base={},pendRender=false;
function jstr(o){return JSON.stringify(o)}
function kindOf(k){return k.split('/')[0]}
function idOf(k){return k.slice(kindOf(k).length+1)}
function itemsOf(){
  var m={};
  S.tasks.forEach(function(t){m['task/'+t.id]=t});
  m['cap/cap']={cap:S.cap};
  m['ctx/ctx']=S.ctx||{};
  Object.keys(S.retro||{}).forEach(function(k){m['retro/'+k]=S.retro[k]});
  Object.keys(S.blockers||{}).forEach(function(k){m['blk/'+k]={t:S.blockers[k]}});
  Object.keys(S.log||{}).forEach(function(k){m['log/'+k]={s:S.log[k]}});
  return m;
}
function rebase(){base={};var m=itemsOf();Object.keys(m).forEach(function(k){base[k]=jstr(m[k])})}
function stamp(){
  var cur=itemsOf(),now=Date.now();
  Object.keys(cur).forEach(function(k){var s=jstr(cur[k]);if(base[k]!==s){base[k]=s;S.u[k]=now;S.dirty[k]=1;delete S.del[k]}});
  Object.keys(base).forEach(function(k){if(!(k in cur)){delete base[k];delete S.u[k];S.del[k]=now;S.dirty[k]=1}});
}
function applyItem(k,data){
  var kind=kindOf(k),id=idOf(k);
  if(kind==='task'){data.id=id;var i=S.tasks.findIndex(function(t){return t.id===id});if(i>=0)S.tasks[i]=data;else S.tasks.push(data)}
  else if(kind==='cap'){if(Array.isArray(data.cap)&&data.cap.length===7)S.cap=data.cap}
  else if(kind==='ctx')S.ctx=data||{};
  else if(kind==='retro')S.retro[id]=data;
  else if(kind==='blk')S.blockers[id]=data.t;
  else if(kind==='log')S.log[id]=data.s;
}
function dropItem(k){
  var kind=kindOf(k),id=idOf(k);
  if(kind==='task')S.tasks=S.tasks.filter(function(t){return t.id!==id});
  else if(kind==='retro')delete S.retro[id];
  else if(kind==='blk')delete S.blockers[id];
  else if(kind==='log')delete S.log[id];
  else if(kind==='ctx')S.ctx={};
}
function mergeRemote(rows){
  var changed=false,rem={};
  rows.forEach(function(r){rem[r.kind+'/'+r.id]=r});
  if(!S.synced){
    if(rows.length)S.seeded=true;
    if(pristine()&&rows.length){S.tasks=[];S.dirty={};S.u={};S.del={};changed=true}
    S.synced=true;
  }
  var cur=itemsOf();
  Object.keys(rem).forEach(function(k){
    var r=rem[k],ru=Number(r.updated_at)||0,lt=Math.max(S.u[k]||0,S.del[k]||0);
    if(ru>lt){
      if(r.deleted){if(k in cur)changed=true;dropItem(k);delete S.u[k];delete S.dirty[k];S.del[k]=ru}
      else if(r.data&&typeof r.data==='object'){applyItem(k,r.data);S.u[k]=ru;delete S.del[k];delete S.dirty[k];changed=true}
    }
  });
  cur=itemsOf();
  Object.keys(cur).forEach(function(k){
    var r=rem[k];
    if(!r){S.u[k]=S.u[k]||((k==='cap/cap'||k==='ctx/ctx')?1:(S.upd||1));S.dirty[k]=1}
    else if((S.u[k]||0)>(Number(r.updated_at)||0))S.dirty[k]=1;
  });
  Object.keys(S.del).forEach(function(k){if(!rem[k]){delete S.del[k];delete S.dirty[k]}});
  return changed;
}
async function sbFetchAll(){
  var out=[],from=0,step=1000;
  for(;;){
    var r=await SB.from('prumo_items').select('kind,id,data,deleted,updated_at').order('kind').order('id').range(from,from+step-1);
    if(r.error)throw r.error;
    out=out.concat(r.data||[]);
    if(!r.data||r.data.length<step)break;
    from+=step;
  }
  return out;
}
async function sbPush(){
  var keys=Object.keys(S.dirty);if(!keys.length)return;
  var cur=itemsOf(),rows=[],sent={};
  keys.forEach(function(k){
    var row=null;
    if(k in cur)row={user_id:SBU,kind:kindOf(k),id:idOf(k),data:cur[k],deleted:false,updated_at:S.u[k]||S.upd||Date.now()};
    else if(S.del[k])row={user_id:SBU,kind:kindOf(k),id:idOf(k),data:{},deleted:true,updated_at:S.del[k]};
    if(row){rows.push(row);sent[k]=row.updated_at}else delete S.dirty[k];
  });
  for(var i=0;i<rows.length;i+=200){
    var r=await SB.from('prumo_items').upsert(rows.slice(i,i+200),{onConflict:'user_id,kind,id'});
    if(r&&r.error)throw r.error;
  }
  Object.keys(sent).forEach(function(k){var now=(S.u[k]||0)>(S.del[k]||0)?S.u[k]:S.del[k];if(now===sent[k])delete S.dirty[k]});
}
function softRender(){
  var a=document.activeElement;
  if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&$('#view').contains(a)){pendRender=true;return}
  render();
}
async function syncNow(pull){
  if(!SB||!SBU)return;
  if(sbBusy){sbQ=Math.max(sbQ,pull?2:1);return}
  sbBusy=true;
  try{
    if(navigator.onLine===false){setSync('off');return}
    var changed=false;
    if(pull||!S.synced){changed=mergeRemote(await sbFetchAll());rebase()}
    await sbPush();
    setSync('ok');writeLocal();
    if(changed)softRender();
  }catch(e){
    setSync(navigator.onLine===false?'off':'err');
    clearTimeout(sbT);sbT=setTimeout(function(){syncNow(true)},30000);
  }
  finally{sbBusy=false}
  if(sbQ){var q=sbQ;sbQ=0;syncNow(q===2)}
}
function pullSoon(ms){clearTimeout(sbT);sbT=setTimeout(function(){syncNow(true)},ms)}
function pushSoon(ms){clearTimeout(sbPT);sbPT=setTimeout(function(){syncNow(false)},ms)}
function subscribeRT(){
  if(sbChan||!SBU)return;
  try{sbChan=SB.channel('prumo-items').on('postgres_changes',{event:'*',schema:'public',table:'prumo_items',filter:'user_id=eq.'+SBU},function(){pullSoon(500)}).subscribe()}catch(e){}
}
function startSync(){setSync('boot');syncNow(true).then(subscribeRT)}
function stopSync(){if(sbChan){try{SB.removeChannel(sbChan)}catch(e){}sbChan=null}setSync('out')}
function initSB(){
  if(!SBCFG)return false;
  try{SB=window.supabase.createClient(SBCFG.url,SBCFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}})}
  catch(e){SB=null;return false}
  window.prumoSB=SB;
  SB.auth.onAuthStateChange(function(ev,session){
    setTimeout(function(){
      var id=session&&session.user?session.user.id:null;
      if(id){if(id!==SBU){SBU=id;startSync()}}
      else if(ev==='SIGNED_OUT'){SBU=null;stopSync()}
    },0);
  });
  window.addEventListener('online',function(){if(SBU)syncNow(true)});
  window.addEventListener('offline',function(){if(SBU)setSync('off')});
  document.addEventListener('focusout',function(){
    if(!pendRender)return;
    setTimeout(function(){var a=document.activeElement;if(pendRender&&!(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))){pendRender=false;render()}},300);
  });
  setInterval(function(){if(SBU&&document.visibilityState==='visible')syncNow(true)},90000);
  return true;
}

var tab='hoje',wkOff=0,selDay=null,sh=null,lastCtx='trabalho',restoreTxt='';
var byId=function(id){return S.tasks.find(function(t){return t.id===id})};
var isDone=function(t){return t.status==='done'};
var cname=function(id){return (S.ctx&&S.ctx[id])||(CTX.find(function(c){return c.id===id})||CTX[0]).name};
var ctxOf=function(id){return CTX.find(function(c){return c.id===id})||CTX[0]};
var quad=function(t){return t.urg&&t.imp?1:(!t.urg&&t.imp?2:(t.urg&&!t.imp?3:4))};
function suggestion(t){
  var e=t.est||0,q=quad(t),n=(t.dodText?String(t.dodText).split('\n').filter(function(x){return x.trim()}).length:(t.dod||[]).length),slips=t.slips||0;
  if(slips>=2)return {fw:'cinco',why:'Você já adiou esta tarefa '+slips+' vezes. Comece só por 5 minutos e decida depois se continua.'};
  if(e<=2)return {fw:'dois',why:'Leva até 2 minutos: faça agora e tire da cabeça.'};
  if(e>=240)return {fw:'pomodoro',why:'Tarefa de '+fmt(e)+'. Pomodoro mantém o ritmo ao longo do dia; vale quebrar em entregas menores.'};
  if(e>=50)return {fw:'pomodoro',why:'Trabalho longo ('+fmt(e)+'): blocos de 25 minutos com pausa evitam o cansaço e o perfeccionismo.'};
  if(e>=30&&n>=3)return {fw:'pomodoro',why:'Tem '+n+' critérios de pronto, então é complexa para o tempo. Divida em blocos de 25 minutos.'};
  if(q===2&&e>=30)return {fw:'cinco',why:'Importante e sem urgência é o que mais se adia. Comece por 5 minutos.'};
  if(e<=15)return {fw:'timebox',why:'Tarefa curta: o tempo estimado é o teto. Acabou, entregue o que tem.'};
  return {fw:'timebox',why:'Cabe em um bloco de '+fmt(e)+'. Defina o teto e entregue quando acabar.'};
}
function suggestFw(t){return suggestion(t).fw}
var fwOf=function(t){return t.fw||suggestFw(t)};
var byPrio=function(a,b){return quad(a)-quad(b)||b.est-a.est};
var tasksOn=function(d){return S.tasks.filter(function(t){return t.day===d})};
var curWk=function(){return addDays(weekStart(todayISO()),wkOff*7)};
var weekTasks=function(wk){var e=addDays(wk,6);return S.tasks.filter(function(t){return t.day&&t.day>=wk&&t.day<=e})};
var overdue=function(){var td=todayISO();return S.tasks.filter(function(t){return !isDone(t)&&t.day&&t.day<td}).sort(function(a,b){return a.day<b.day?-1:1})};
var wipCount=function(){return S.tasks.filter(function(t){return t.status==='doing'}).length};
function shortDate(s){var d=parseISO(s);return DABR[d.getDay()]+', '+d.getDate()+' '+MONS[d.getMonth()]}
function rangeLabel(wk){var a=parseISO(wk),b=parseISO(addDays(wk,6));
  return a.getMonth()===b.getMonth()?a.getDate()+'–'+b.getDate()+' '+MONS[b.getMonth()]:a.getDate()+' '+MONS[a.getMonth()]+' – '+b.getDate()+' '+MONS[b.getMonth()]}
function streak(){
  var days={};S.tasks.forEach(function(t){if(isDone(t)&&t.doneAt)days[iso(new Date(t.doneAt))]=1});
  var d=todayISO(),n=0;if(!days[d])d=addDays(d,-1);
  while(days[d]){n++;d=addDays(d,-1)}return n;
}
function nextTask(){
  var td=todayISO();
  var open=S.tasks.filter(function(t){return !isDone(t)&&t.day===td});
  var doing=open.filter(function(t){return t.status==='doing'});
  var mits=open.filter(function(t){return t.mit&&t.status!=='doing'}).sort(byPrio);
  var rest=open.filter(function(t){return !t.mit&&t.status!=='doing'}).sort(byPrio);
  return doing.concat(mits,rest)[0]||null;
}

}
function rowHTML(t,o){
  o=o||{};var done=isDone(t),c=ctxOf(t.ctx),f=FW[fwOf(t)];
  var dt=(t.dod||[]).length,dn=(t.dod||[]).filter(function(x){return x.d}).length;

  if(t.ex)tags.push('<span class="tag">exemplo</span>');
  if(t.parent){var pg=byId(t.parent);if(pg)tags.push('<span class="tag">Pauta: '+esc(pg.title)+'</span>')}
  if(o.sapo&&!done)tags.push('<span class="tag hot">Sapo</span>');
  if(t.status==='doing'&&!done)tags.push('<span class="tag go">em andamento</span>');
  if((t.slips||0)>0&&!done)tags.push('<span class="tag warn">adiada '+t.slips+'×</span>');
  var meta='<span><i class="dot" style="background:var('+c.v+')"></i>'+esc(cname(c.id))+'</span><span>'+fmt(t.est)+'</span><span>'+esc(f.name)+'</span>'+(dt?'<span>'+dn+'/'+dt+' pronto</span>':'')+(fwOf(t)==='pomodoro'&&t.est>=50?'<span>'+(t.pomos||0)+'/'+Math.ceil(t.est/25)+' pomodoros</span>':'');
  var right='';
  if(!done){
    if(o.star)right+='<button class="ib'+(t.mit?' on':'')+'" data-act="mit" data-id="'+t.id+'" aria-pressed="'+(!!t.mit)+'" aria-label="Prioridade do dia">'+ic('star')+'</button>';
    if(o.play)right+='<button class="ib play" data-act="start" data-id="'+t.id+'" aria-label="Começar">'+ic('play')+'</button>';

var revMode='rev',dashRange='week';
function periodList(mode){
  var out=[],i,td=todayISO();
  if(mode==='week'){
    var w0=weekStart(td);
    for(i=7;i>=0;i--){var a=addDays(w0,-7*i);out.push({from:a,to:addDays(a,6),label:parseISO(a).getDate()+' '+MONS[parseISO(a).getMonth()],cur:i===0})}
  }else{
    var n=new Date();
    for(i=5;i>=0;i--){var d=new Date(n.getFullYear(),n.getMonth()-i,1),e=new Date(d.getFullYear(),d.getMonth()+1,0);
      out.push({from:iso(d),to:iso(e),label:MONS[d.getMonth()],cur:i===0})}
  }
  return out;
}
function periodStats(p){
  var f=p.from,e=p.to,done=[],planned=0,slips=0,estSum=0,realSum=0,estReal=0,nReal=0;
  S.tasks.forEach(function(t){
    if(isGrp(t))return;
    if(t.day&&t.day>=f&&t.day<=e){planned++;slips+=t.slips||0}
    if(isDone(t)&&t.doneAt){var dd=iso(new Date(t.doneAt));if(dd>=f&&dd<=e){
      done.push(t);var est=t.est0||t.est;estSum+=est;
      if((t.focus||0)>=60){realSum+=t.focus/60;estReal+=est;nReal++}}}
  });
  var focus=0,d=f;while(d<=e){focus+=S.log[d]||0;d=addDays(d,1)}
  return {done:done.length,planned:planned,rate:planned?Math.round(done.length/planned*100):null,focus:focus/60,slips:slips,estSum:estSum,realSum:realSum,
    ratio:estReal?realSum/estReal:null,nReal:nReal};
}
function deltaHTML(cur,prev,unit,goodUp){

function viewRevisao(){

  var pomos=sum(dn,function(t){return t.pomos||0});

  var rt=S.retro[wk]||{};

    h+='<div class="list">'+CTX.map(function(c){var l=dn.filter(function(t){return t.ctx===c.id});if(!l.length)return '';
      return '<div class="row" style="display:block;padding:12px 16px"><div class="eyebrow" style="display:flex;align-items:center;gap:8px"><i class="dot" style="background:var('+c.v+')"></i>'+esc(cname(c.id))+' · '+l.length+'</div>'+l.map(function(t){return '<div style="display:flex;gap:10px;margin-top:8px;align-items:baseline"><span style="color:var(--ok);flex:none">'+ic('check',15,2.6)+'</span><span style="min-width:0;overflow-wrap:anywhere">'+esc(t.title)+' <span class="muted" style="font-size:13px">'+DABR[parseISO(t.day).getDay()]+'</span></span></div>'}).join('')+'</div>'}).join('')+'</div>';
  }else h+='<p class="hint">Nada concluído nesta semana ainda. Uma tarefa de 5 minutos já muda isso.</p>';
  if(open.length){
    h+=secHTML('Ainda aberto',open.length)+listHTML(open.sort(function(a,b){return (b.slips||0)-(a.slips||0)}),{},null);
    if(open.some(function(t){return (t.slips||0)>=2}))h+='<p class="hint" style="margin-top:8px">Tarefas adiadas 2 vezes ou mais pedem um passo menor. Quebre em partes de 15 minutos ou use o Só 5 minutos.</p>';

  if(fk.length)h+=secHTML('Como você trabalhou')+'<div class="chips">'+fk.map(function(k){return '<span class="chip" style="min-height:38px">'+esc(FW[k].name)+' · '+fwc[k]+'</span>'}).join('')+'</div>';

  var t=byId(sh.id),g=sh.g||{},name=(g.name||'').trim(),n=Math.max(1,Math.min(20,Math.round(Number(g.n)||1))),est=Math.round(Number(g.est)||0);

  var have=S.tasks.filter(function(c){return c.parent===t.id&&c.type===name}).length;
  for(var i=1;i<=n;i++)S.tasks.push({id:uid(),title:(n>1||have)?name+' '+(have+i):name,type:name,parent:t.id,ctx:t.ctx,est:est,est0:est,day:t.day||null,status:'todo',fw:null,urg:!!t.urg,imp:!!t.imp,dod:[],mit:false,slips:0,focus:0,pomos:0,created:Date.now(),ex:false});

function toggleMit(id){

  var ids=[id].concat(kidsOf(id).map(function(c){return c.id})),gone=S.tasks.filter(function(t){return ids.indexOf(t.id)>=0});

  var wk=curWk(),td=todayISO();

  if(!days.length){toast('Esta semana já passou. Vá para a próxima.');return}
  var load={};days.forEach(function(d){load[d]=sum(tasksOn(d),function(t){return t.est})});
  var cap=function(d){return S.cap[parseISO(d).getDay()]||0};
  var pool=S.tasks.filter(function(t){return !t.day&&!isDone(t)&&!isGrp(t)}).sort(function(a,b){return quad(a)-quad(b)||(b.slips||0)-(a.slips||0)||b.est-a.est});

  var k=e.key;
  if(k==='n'||k==='N'){e.preventDefault();act('new',{dataset:{}})}
  else if(k==='1'||k==='2'||k==='3'||k==='4'){var TT=['hoje','semana','foco','revisao'];act('tab',{dataset:{t:TT[Number(k)-1]}})}
  else if(k===' '&&tag!=='BUTTON'&&S.session&&!S.session.alerted){e.preventDefault();act(S.session.running?'pause':'resume',{dataset:{}})}
});

/* ---------- boot ---------- */
async function boot(){
  prune(400);
  initSB();
  rebase();
  initNav();
  if(S.session)tab='foco';
  render();
  var tw=null;
  try{tw=new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(1)},500)'],{type:'text/javascript'})));tw.onmessage=function(){tick()}}catch(e){tw=null}
  if(!tw)setInterval(tick,250);
  await Promise.race([initRemote(),new Promise(function(r){setTimeout(r,4500)})]);
  booted=true;
  if(!S.seeded&&!S.tasks.length)seed();
  render();
  tick();
}
boot();
})();
</script>

<style>
#gate{position:fixed;inset:0;z-index:200;background:var(--bg);color:var(--ink);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));font-family:var(--body)}
#gate[hidden]{display:none!important}
#gate form{width:100%;max-width:380px;display:grid;gap:14px}
#gate .g-mark{width:44px;height:44px}
#gate h1{font:800 36px/1.02 var(--display);letter-spacing:-.025em;margin:0}
#gate p{margin:0;color:var(--muted);font-size:15px}
#gate .g-err{color:var(--bad);min-height:20px;font-size:14px}
</style>
<div id="gate" role="dialog" aria-modal="true" aria-labelledby="g-t" hidden>
  <form id="g-f" autocomplete="on" novalidate>
    <svg class="g-mark" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="6" r="2.2" fill="currentColor"/><path d="M22 6v20" stroke="currentColor" stroke-width="2"/><path d="M22 24l7 9-7 11-7-11z" fill="var(--accent)"/></svg>
    <h1 id="g-t">Prumo</h1>
    <p>Entre com a sua conta para ver e sincronizar suas tarefas.</p>
    <div><label class="lab" for="g-em">E-mail</label><input id="g-em" class="inp" type="email" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="email" required></div>
    <div><label class="lab" for="g-pw">Senha</label><input id="g-pw" class="inp" type="password" name="password" autocomplete="current-password" required></div>
    <div class="g-err" id="g-e" role="alert"></div>
    <button class="btn btn-p btn-full" id="g-b" type="submit">Entrar</button>
  </form>
</div>
<script>
(function(){
var gate=document.getElementById('gate'),form=document.getElementById('g-f'),em=document.getElementById('g-em'),pw=document.getElementById('g-pw'),err=document.getElementById('g-e'),btn=document.getElementById('g-b');
var LOCKABLE=['.wrap','#tabs','#sheet','#toast'];
function setInert(v){LOCKABLE.forEach(function(s){var e=document.querySelector(s);if(e){if(v)e.setAttribute('inert','');else e.removeAttribute('inert')}})}
function stored(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^sb-.*-auth-token$/.test(k)){var v=JSON.parse(localStorage.getItem(k));if(v&&v.refresh_token)return true}}}catch(e){}return false}
function unlock(){gate.hidden=true;setInert(false);pw.value=''}
function lock(){gate.hidden=false;setInert(true);err.textContent='';setTimeout(function(){em.focus()},50)}
window.prumoLock=async function(){try{await window.prumoSB.auth.signOut()}catch(e){}lock()};
var sb=window.prumoSB;
if(sb){
  sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT')lock();else if(ev==='SIGNED_IN')unlock()});
}
form.addEventListener('submit',async function(e){
  e.preventDefault();
  if(!window.prumoSB){err.textContent='Não consegui carregar o login. Recarregue a página.';return}
  var mail=em.value.trim(),pass=pw.value;
  if(!mail||!pass){err.textContent='Informe e-mail e senha.';return}
  btn.disabled=true;err.textContent='';
  try{
    var r=await window.prumoSB.auth.signInWithPassword({email:mail,password:pass});
    if(r.error){
      var m=(r.error.message||'');
      err.textContent=/invalid login/i.test(m)?'E-mail ou senha incorretos.':(/not confirmed/i.test(m)?'Confirme o e-mail da conta antes de entrar.':(/fetch|network|retryable/i.test(m+r.error.name)?'Sem conexão. Tente de novo.':'Não consegui entrar. Tente de novo.'));
    }else unlock();
  }catch(x){err.textContent='Sem conexão. Tente de novo.'}
  btn.disabled=false;
});
if(stored()){unlock()}else{lock()}
})();
</script>
