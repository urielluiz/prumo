<!-- Supabase > Authentication > Emails > Reset password. Assunto: Código para criar uma nova senha no Prumo -->
<div style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#12141F">
  <h1 style="font-size:24px;margin:0 0 12px">Criar uma nova senha</h1>
  <p style="font-size:15px;line-height:1.5;margin:0 0 16px">Use este código no Prumo:</p>
  <p style="font:600 32px/1 ui-monospace,Menlo,monospace;letter-spacing:6px;margin:0 0 20px">{{ .Token }}</p>
  <p style="font-size:15px;line-height:1.5;margin:0 0 16px">Ou toque aqui: <a href="{{ .SiteURL }}/#token_hash={{ .TokenHash }}&type=recovery">criar nova senha</a>.</p>
  <p style="font-size:13px;line-height:1.5;color:#5B6070;margin:0">Nunca pedimos este código por mensagem ou telefone. Se você não pediu, ignore este e-mail: sua senha continua a mesma.</p>
</div>
