<meta name="claude:viewport-fit-sides" content="cover">
<title>Prumo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Prumo. Uma coluna de leitura (max 560px), cabecalho grande, barra de abas fixa embaixo
   com acao central, e folhas (bottom sheets) para criar e editar tarefas. */
:root{
  --bg:#EEF0F4;--surface:#FFFFFF;--ink:#12141F;--muted:#626878;--line:#DCDFE7;--soft:#E7EAF0;
  --accent:#CF3F0C;--accent-ink:#FFFFFF;--accent-soft:#FCE3D9;--accent-text:#A8300A;
  --ok:#14804A;--ok-soft:#DCF2E5;--warn:#9A5B00;--warn-soft:#FAEBCF;--bad:#C23B3B;
  --c1:#2F55D4;--c2:#A23B9C;--c3:#0F8C7E;--c4:#B07A00;
  --hero-bg:#12141F;--hero-fg:#F4F5F9;
  --shadow:0 1px 2px rgba(18,20,31,.05),0 10px 28px rgba(18,20,31,.07);
  --display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0F17;--surface:#161925;--ink:#EEF0F7;--muted:#9AA1B4;--line:#272C3C;--soft:#1F2331;
  --accent:#FF7A45;--accent-ink:#1A0B04;--accent-soft:#3B1F12;--accent-text:#FF9B72;
  --ok:#4CC38A;--ok-soft:#14301F;--warn:#E8A33D;--warn-soft:#3A2A0E;--bad:#F27B7B;
  --c1:#7C97FF;--c2:#D77BD0;--c3:#3FCDBB;--c4:#E3B84A;
  --hero-bg:#1F2333;--hero-fg:#F4F5F9;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F17;--surface:#161925;--ink:#EEF0F7;--muted:#9AA1B4;--line:#272C3C;--soft:#1F2331;
  --accent:#FF7A45;--accent-ink:#1A0B04;--accent-soft:#3B1F12;--accent-text:#FF9B72;
  --ok:#4CC38A;--ok-soft:#14301F;--warn:#E8A33D;--warn-soft:#3A2A0E;--bad:#F27B7B;
  --c1:#7C97FF;--c2:#D77BD0;--c3:#3FCDBB;--c4:#E3B84A;
  --hero-bg:#1F2333;--hero-fg:#F4F5F9;--shadow:none;color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.lock{overflow:hidden}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);
  padding-block:12px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin-inline:auto;min-width:0}
.ic{flex:none;display:block}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}

.eyebrow{font:600 12px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h1{font:800 36px/1.02 var(--display);letter-spacing:-.025em;margin:6px 0 0;text-wrap:balance;overflow-wrap:anywhere}
.h2{font:800 20px/1.15 var(--display);letter-spacing:-.01em;margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:8px 2px 18px}
.top>div{min-width:0}
.cnt{font:500 13px var(--mono);color:var(--muted)}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:26px 4px 10px}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:14px;margin:0 4px}
.stack{display:grid;gap:12px}

.btn{min-height:48px;padding:0 20px;border-radius:14px;font:600 16px var(--body);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px;border-radius:12px}
.btn-p{background:var(--accent);color:var(--accent-ink)}
.btn-s{background:var(--soft);color:var(--ink)}
.btn-g{color:var(--muted)}
.btn-full{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:10px}

.hero{background:var(--hero-bg);color:var(--hero-fg);border-radius:22px;padding:20px;display:grid;gap:12px}
.hero .eyebrow{color:inherit;opacity:.65}
.hero-t{font:800 26px/1.1 var(--display);letter-spacing:-.015em;overflow-wrap:anywhere;text-wrap:balance}
.hero-p{margin:0;opacity:.8;font-size:15px}
.hero .btn-s{background:rgba(255,255,255,.14);color:var(--hero-fg)}

.checkin{margin-bottom:14px}
.lab{font:600 12px/1.2 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:block;margin:0 2px 8px}
.inp{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font:500 17px var(--body);color:var(--ink)}
textarea.inp{padding:12px 14px;min-height:92px;resize:vertical;line-height:1.4}
.sheet .inp{background:var(--bg)}

.banner{background:var(--accent-soft);color:var(--ink);border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;font-size:14px}
.banner span{min-width:0}

.list{background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:4px;padding:6px 8px 6px 4px;min-height:64px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;text-align:left;padding:8px 6px}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-meta{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:13px;color:var(--muted);margin-top:2px}
.row-meta span{display:inline-flex;align-items:center;gap:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font:600 11px/1 var(--body);padding:4px 7px;border-radius:6px;background:var(--soft);color:var(--ink)}
.tag.hot{background:var(--accent-soft);color:var(--accent-text)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.go{background:var(--ok-soft);color:var(--ok)}
.is-done .row-title{text-decoration:line-through;color:var(--muted)}
.chk{width:44px;height:44px;display:grid;place-items:center;flex:none}
.chk i{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;color:var(--accent-ink)}
.chk i.on{background:var(--ok);border-color:var(--ok)}
.gi{width:36px;display:grid;place-items:center;color:var(--muted);flex:none}
.kidrow{display:flex;justify-content:space-between;gap:10px;width:100%;padding:12px 14px;text-align:left;border-top:1px solid var(--line);align-items:center}
.kidrow:first-child{border-top:0}
.kidadd{display:grid;gap:8px}
.opts{display:grid;gap:0;background:var(--surface);border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line);overflow:hidden}
.optrow{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 14px;text-align:left;border-top:1px solid var(--line)}
.optrow:first-child{border-top:0}
.optrow .ot{font-weight:600}
.optrow .os{margin-left:auto;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%}
.optrow svg{flex:none;color:var(--muted)}
.optbody{padding:4px 14px 16px;display:grid;gap:8px;border-top:1px solid var(--line);background:var(--bg)}
.helpit{padding:12px 0;border-top:1px solid var(--line)}
.helpit p{margin:6px 0 0;font-size:14px}
.kl{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.kidnum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kidnum label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.link{color:var(--accent);font-weight:600;text-decoration:underline}
.bars{display:flex;gap:6px;align-items:flex-end;height:130px}
.bc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.bt{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bt i{display:block;width:70%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--line)}
.bt i.cur{background:var(--accent)}
.bv{font:600 11px/1 var(--mono);color:var(--muted);height:12px}
.bl{font-size:11px;color:var(--muted)}
.dl{display:block;font-size:12px;margin-top:3px;color:var(--muted)}
.rn2s{display:grid;gap:2px}
.rn2{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.rn2:first-child{border-top:0}
.ib.del{width:38px;color:var(--muted);opacity:.75}
.ib.del:active{color:var(--bad)}
@media (hover:hover){.ib.del:hover{color:var(--bad);opacity:1}}
.sugg{background:var(--soft);border-radius:14px;padding:12px 14px}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--muted);flex:none}
.ib.on{color:var(--accent)}
.ib.on .ic{fill:currentColor}
.ib.play{color:var(--accent)}

.pring{position:relative;width:68px;height:68px;flex:none}
.pring svg{transform:rotate(-90deg)}
.pring b{position:absolute;inset:0;display:grid;place-items:center;font:500 14px var(--mono)}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex}
.bar>i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.panel{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:grid;gap:12px}
.nums{display:flex;gap:18px;flex-wrap:wrap}
.nums div{min-width:0}
.nums b{display:block;font:800 30px/1 var(--display);letter-spacing:-.02em}
.nums small{font-size:13px;color:var(--muted)}

.nav{display:flex;align-items:center;gap:2px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:14px}
.dy{display:grid;justify-items:center;gap:3px;padding:9px 0 8px;border-radius:14px;background:var(--surface);min-width:0}
.dy small{font:600 11px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.dy b{font:800 19px/1 var(--display)}
.dy em{font:500 11px var(--mono);font-style:normal;color:var(--muted)}
.dy[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dy[aria-pressed="true"] small,.dy[aria-pressed="true"] em{color:inherit;opacity:.75}
.dy.today b{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:4px}
.dy.alldone em{color:var(--ok)}
.dy.alldone[aria-pressed="true"] em{color:inherit}

.timer{display:grid;justify-items:center;gap:14px;margin:6px 0 20px;text-align:center}
.ring{position:relative;width:min(76vw,290px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--soft);stroke-width:12}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round}
.ring.brk .ring-fg{stroke:var(--ok)}
.ring-in{position:absolute;inset:0;display:grid;place-content:center;gap:4px}
.clock{font:500 clamp(48px,17vw,68px)/1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pomos{display:flex;gap:8px}
.pomos i{width:12px;height:12px;border-radius:50%;background:var(--soft)}
.pomos i.on{background:var(--accent)}
.how{margin:0;color:var(--muted);max-width:34ch;font-size:15px;text-wrap:balance}
.endcard{background:var(--hero-bg);color:var(--hero-fg);border-radius:20px;padding:18px;display:grid;gap:12px;margin-bottom:16px}
.endcard .hero-t{font-size:22px}
.endcard .btn-s{background:rgba(255,255,255,.14);color:var(--hero-fg)}
.dodrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;min-height:48px;border-top:1px solid var(--line)}
.dodrow:first-child{border-top:0}
.dodrow i{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.dodrow i.on{background:var(--ok);border-color:var(--ok)}
.dodrow span{min-width:0;overflow-wrap:anywhere}

.mini{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);z-index:19;display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);border-radius:16px;padding:6px 6px 6px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.mini[hidden]{display:none}
.mini-main{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;text-align:left;color:inherit;padding:6px 0}
.mini-main b{font:700 20px/1 var(--mono);letter-spacing:-.02em}
.mini-main span{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.mini-btn{flex:none;min-height:44px;padding:0 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;display:inline-flex;align-items:center;gap:6px}
html.hasmini .wrap{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}
@media (min-width:900px){.mini{left:auto;right:24px;bottom:24px;width:360px}html.hasmini .wrap{padding-bottom:96px}}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
@supports (backdrop-filter:blur(10px)){.tabs{background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}}
.tab{position:relative;flex:1;max-width:92px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 11px var(--body);color:var(--muted)}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::after{content:"";position:absolute;top:-7px;width:22px;height:3px;border-radius:3px;background:var(--accent)}
.tab .pip{position:absolute;top:6px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--accent)}
.tab-add{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-20px;flex:none;box-shadow:0 8px 18px rgba(207,63,12,.35)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:500;font-size:15px;max-width:min(92vw,440px);display:flex;align-items:center;gap:14px}
.toast button{font-weight:700;color:var(--accent-text);color:inherit;text-decoration:underline;white-space:nowrap}

/* retrô */
.rwrap{position:fixed;inset:0;z-index:90;color:#fff;font-family:var(--body);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;animation:wrin .35s ease-out}
.wr-bg{position:absolute;inset:0;transition:background .4s}
.c-a{background:radial-gradient(120% 90% at 85% 0%,#FF7A45 0%,#B4300A 45%,#2A0F08 100%)}
.c-b{background:radial-gradient(120% 90% at 10% 0%,#4CC38A 0%,#0F6B55 50%,#071F20 100%)}
.c-c{background:radial-gradient(120% 90% at 90% 10%,#6AA7FF 0%,#2C46B8 50%,#0C1033 100%)}
.c-d{background:radial-gradient(120% 90% at 15% 5%,#C98BFF 0%,#6A2BB8 50%,#1B0B33 100%)}
.c-e{background:radial-gradient(120% 90% at 80% 0%,#FFC247 0%,#B0620B 50%,#2B1503 100%)}
.wr-prog{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:14px;right:14px;display:flex;gap:5px;z-index:2}
.wr-prog span{flex:1;height:3.5px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
.wr-prog i{display:block;height:100%;background:#fff;width:0}
.wr-x{position:absolute;top:calc(26px + env(safe-area-inset-top,0px));right:10px;z-index:3;width:44px;height:44px;display:grid;place-items:center;color:#fff;border-radius:50%}
.wr-slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:90px 28px 60px;max-width:560px;margin:0 auto;gap:14px}
.wr-eb{font:600 13px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.wr-big{font:800 clamp(38px,11vw,64px)/1 var(--display);letter-spacing:-.03em;text-wrap:balance}
.wr-huge{font:800 clamp(110px,38vw,220px)/.9 var(--display);letter-spacing:-.05em}
.wr-huge.wr-mid{font-size:clamp(64px,20vw,120px)}
.wr-p{font-size:18px;line-height:1.4;opacity:.92;margin:0;max-width:34ch}
.wr-quote{font:700 clamp(28px,8vw,44px)/1.1 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere;text-wrap:balance}
.wr-track{height:12px;border-radius:12px;background:rgba(255,255,255,.25);overflow:hidden}
.wr-track i{display:block;height:100%;width:0;background:#fff;border-radius:12px;transition:width 1.1s cubic-bezier(.2,.8,.2,1) .2s}
.wr-bars{display:flex;align-items:flex-end;gap:10px;height:170px;margin:6px 0}
.wr-bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.wr-bar i{display:block;width:100%;height:0;border-radius:8px 8px 3px 3px;background:rgba(255,255,255,.55);transition:height .9s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i)*70ms + 150ms)}
.wr-bar.best i{background:#fff}
.wr-bar small{font:500 12px var(--mono);opacity:.85;text-transform:uppercase}
.wr-seg{display:flex;height:34px;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.18)}
.wr-seg i{display:block;height:100%;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i)*120ms + 150ms)}
.wr-leg{display:flex;flex-direction:column;gap:10px;font-size:19px}
.wr-leg b{font:800 24px var(--display);margin-right:4px}
.wr-leg .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:10px}
.wr-cmp{display:flex;gap:22px}
.wr-cmp div{flex:1;display:flex;flex-direction:column;gap:6px}
.wr-cmp small{font:500 13px var(--mono);text-transform:uppercase;letter-spacing:.1em;opacity:.8}
.wr-cmp b{font:800 clamp(40px,12vw,64px)/1 var(--display);letter-spacing:-.03em}
.wr-chip{align-self:flex-start;background:rgba(255,255,255,.2);padding:8px 14px;border-radius:30px;font-weight:600}
.wr-btns{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.wr-btn{min-height:50px;border-radius:14px;font-weight:700;font-size:17px;background:rgba(255,255,255,.2);color:#fff;transition:transform .12s}
.wr-btn.p{background:#fff;color:#1A0B04}
.wr-btn.g{background:transparent;text-decoration:underline}
.wr-btn:active{transform:scale(.97)}
.wr-in{animation:wrup .6s cubic-bezier(.2,.8,.2,1) both}
.wr-in2{animation:wrup .6s cubic-bezier(.2,.8,.2,1) .25s both}
.rwrap.hold .wr-slide{opacity:.9;transition:opacity .15s}
.conf{position:fixed;inset:0;z-index:95;pointer-events:none;overflow:hidden;z-index:5}
.conf i{position:absolute;top:-20px;border-radius:2px;animation:conf linear forwards}
@keyframes conf{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
@keyframes wrup{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes wrin{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.wrapban{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:16px;background:linear-gradient(120deg,#B4300A,#6A2BB8);color:#fff;margin-bottom:12px;animation:wrup .5s ease-out}
.wrapban div{display:flex;flex-direction:column;gap:2px}.wrapban span{opacity:.85;font-size:14px}
.wrapban .btn{background:#fff;color:#1A0B04}
.wrapcard{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:16px;border-radius:16px;background:linear-gradient(120deg,#B4300A,#6A2BB8);color:#fff;margin-bottom:14px;transition:transform .12s}
.wrapcard:active{transform:scale(.98)}.wrapcard b{display:block;font:800 18px var(--display)}.wrapcard small{opacity:.85;font-size:14px}

  cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',

  check:'<path d="M5.5 12.5l4.2 4.2 8.8-9.2"/>',

  right:'<path d="M9.5 5.5L16 12l-6.5 6.5"/>',

  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  up:'<path d="M6 14l6-6 6 6"/>',
  down:'<path d="M6 10l6 6 6-6"/>',

};
function ic(n,s,w){s=s||22;return '<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||1.9)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[n]+'</svg>'}

/* ---------- estado e persistencia ---------- */
var LS='prumo.v1';
function blank(){return {v:1,upd:0,seeded:false,tasks:[],rec:{},cap:[0,300,300,300,300,300,120],ctx:{},retro:{},blockers:{},log:{},session:null,u:{},dirty:{},del:{},synced:false}}
function readLocal(){try{var r=localStorage.getItem(LS);if(r){return Object.assign(blank(),JSON.parse(r))}}catch(e){}return blank()}
var S=readLocal();
function writeLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
var saveT=null,pushing=false,again=false,remote=null,sync='boot',booted=false;
function kidsOf(id){return S.tasks.filter(function(c){return c.parent===id})}
function isGrp(t){return S.tasks.some(function(c){return c.parent===t.id})}
function fixGroups(){S.tasks.forEach(function(t){if(!isGrp(t))return;var k=kidsOf(t.id),all=k.every(function(c){return c.status==='done'});
  if(all&&t.status!=='done'){t.status='done';t.doneAt=Math.max.apply(null,k.map(function(c){return c.doneAt||0}))||Date.now()}
  else if(!all&&t.status==='done'){t.status='todo';t.doneAt=null}
  if(t.day)t.day=null;t.mit=false})}
function persist(){try{topUpRec()}catch(e){}fixGroups();S.upd=Date.now();try{timerSync();clearTimeout(remT);remT=setTimeout(remSync,2500)}catch(e){}if(SBCFG)stamp();writeLocal();clearTimeout(saveT);saveT=setTimeout(pushRemote,700);if(SBCFG)pushSoon(900)}
function setSync(s){sync=s;var e=$('#sync');if(e)e.textContent=syncText()}
function syncText(){
  if(sync==='ok')return 'Sincronizado com a sua conta.';
  if(sync==='err')return 'Não consegui sincronizar agora. Tento de novo na próxima alteração.';
  if(sync==='boot')return 'Conectando...';
  if(sync==='off')return 'Sem conexão. As alterações serão enviadas quando voltar.';
  if(sync==='out')return 'Você saiu da conta. Este aparelho não está sincronizando.';
  return 'Salvo só neste aparelho. Faça backup de vez em quando.';
}
function prune(days){
  var lim=Date.now()-days*864e5;
  S.tasks=S.tasks.filter(function(t){return !(t.status==='done'&&t.doneAt&&t.doneAt<lim)});
  var keep=iso(new Date(Date.now()-400*864e5));
  Object.keys(S.log).forEach(function(k){if(k<keep)delete S.log[k]});
}
async function pushRemote(){
  if(!remote)return;
  if(pushing){again=true;return}
  pushing=true;
  try{
    var data=Object.assign({},S,{session:null});
    if(JSON.stringify(data).length>230000){prune(60);data=Object.assign({},S,{session:null})}
    await remote.set(clone(data));
    setSync('ok');
  }catch(e){setSync('err')}
  pushing=false;
  if(again){again=false;pushRemote()}
}
function pristine(){return S.seeded&&S.tasks.length>0&&S.tasks.every(function(t){return t.ex})}
async function pullRemote(){
  if(!remote)return;
  try{
    var snap=await remote.get();
    var r=snap&&snap.exists?snap.data():null;
    if(r&&r.upd){
      if(r.upd>S.upd||(pristine()&&r.tasks&&r.tasks.length)){
        var keep=S.session;
        S=Object.assign(blank(),clone(r),{session:keep||null});
        writeLocal();setSync('ok');render();
      }else if(S.upd>r.upd){pushRemote()}
      else setSync('ok');
    }else if(S.upd){pushRemote()}
    else setSync('ok');
  }catch(e){setSync('err')}
}
async function initRemote(){
  if(SBCFG)return;
  try{
    if(!(window.claude&&window.claude.use)){setSync('local');return}
    var user=await window.claude.use('user');
    var db=await window.claude.use('db');
    if(!user||!db){setSync('local');return}
    var id=await user.id();
    if(!id){setSync('local');return}
    remote=db.collection('data/users/'+id).doc('prumo');
    await pullRemote();
  }catch(e){setSync('local')}
}

/* ---------- sincronizacao com o Supabase (so quando ha configuracao) ---------- */
var SBCFG=(window.PRUMO_SB&&window.supabase&&window.supabase.createClient)?window.PRUMO_SB:null;
var SB=null,SBU=null,sbChan=null,sbBusy=false,sbQ=0,sbT=null,sbPT=null,base={},pendRender=false;
function jstr(o){return JSON.stringify(o)}
function kindOf(k){return k.split('/')[0]}
function idOf(k){return k.slice(kindOf(k).length+1)}
function itemsOf(){
  var m={};
  S.tasks.forEach(function(t){m['task/'+t.id]=t});
  m['cap/cap']={cap:S.cap};
  m['ctx/ctx']=S.ctx||{};
  Object.keys(S.rec||{}).forEach(function(k){m['rec/'+k]=S.rec[k]});
  Object.keys(S.retro||{}).forEach(function(k){m['retro/'+k]=S.retro[k]});
  Object.keys(S.blockers||{}).forEach(function(k){m['blk/'+k]={t:S.blockers[k]}});
  Object.keys(S.log||{}).forEach(function(k){m['log/'+k]={s:S.log[k]}});
  return m;
}
function rebase(){base={};var m=itemsOf();Object.keys(m).forEach(function(k){base[k]=jstr(m[k])})}
function stamp(){
  var cur=itemsOf(),now=Date.now();
  Object.keys(cur).forEach(function(k){var s=jstr(cur[k]);if(base[k]!==s){base[k]=s;S.u[k]=now;S.dirty[k]=1;delete S.del[k]}});
  Object.keys(base).forEach(function(k){if(!(k in cur)){delete base[k];delete S.u[k];S.del[k]=now;S.dirty[k]=1}});
}
function applyItem(k,data){
  var kind=kindOf(k),id=idOf(k);
  if(kind==='task'){data.id=id;var i=S.tasks.findIndex(function(t){return t.id===id});if(i>=0)S.tasks[i]=data;else S.tasks.push(data)}
  else if(kind==='rec'){data.id=id;S.rec=S.rec||{};S.rec[id]=data}
  else if(kind==='cap'){if(Array.isArray(data.cap)&&data.cap.length===7)S.cap=data.cap}
  else if(kind==='ctx')S.ctx=data||{};
  else if(kind==='retro')S.retro[id]=data;
  else if(kind==='blk')S.blockers[id]=data.t;
  else if(kind==='log')S.log[id]=data.s;
}
function dropItem(k){
  var kind=kindOf(k),id=idOf(k);
  if(kind==='task')S.tasks=S.tasks.filter(function(t){return t.id!==id});
  else if(kind==='rec'){if(S.rec)delete S.rec[id]}
  else if(kind==='retro')delete S.retro[id];
  else if(kind==='blk')delete S.blockers[id];
  else if(kind==='log')delete S.log[id];
  else if(kind==='ctx')S.ctx={};
}
function mergeRemote(rows){
  var changed=false,rem={};
  rows.forEach(function(r){rem[r.kind+'/'+r.id]=r});
  if(!S.synced){
    if(rows.length)S.seeded=true;
    if(pristine()&&rows.length){S.tasks=[];S.dirty={};S.u={};S.del={};changed=true}
    S.synced=true;
  }
  var cur=itemsOf();
  Object.keys(rem).forEach(function(k){
    var r=rem[k],ru=Number(r.updated_at)||0,lt=Math.max(S.u[k]||0,S.del[k]||0);
    if(ru>lt){
      if(r.deleted){if(k in cur)changed=true;dropItem(k);delete S.u[k];delete S.dirty[k];S.del[k]=ru}
      else if(r.data&&typeof r.data==='object'){applyItem(k,r.data);S.u[k]=ru;delete S.del[k];delete S.dirty[k];changed=true}
    }
  });
  cur=itemsOf();
  Object.keys(cur).forEach(function(k){
    var r=rem[k];
    if(!r){S.u[k]=S.u[k]||((k==='cap/cap'||k==='ctx/ctx')?1:(S.upd||1));S.dirty[k]=1}
    else if((S.u[k]||0)>(Number(r.updated_at)||0))S.dirty[k]=1;
  });
  Object.keys(S.del).forEach(function(k){if(!rem[k]){delete S.del[k];delete S.dirty[k]}});
  try{if(topUpRec()){changed=true;stamp()}}catch(e){}
  return changed;
}
async function sbFetchAll(){
  var out=[],from=0,step=1000;
  for(;;){
    var r=await SB.from('prumo_items').select('kind,id,data,deleted,updated_at').order('kind').order('id').range(from,from+step-1);
    if(r.error)throw r.error;
    out=out.concat(r.data||[]);
    if(!r.data||r.data.length<step)break;
    from+=step;
  }
  return out;
}
async function sbPush(){
  var keys=Object.keys(S.dirty);if(!keys.length)return;
  var cur=itemsOf(),rows=[],sent={};
  keys.forEach(function(k){
    var row=null;
    if(k in cur)row={user_id:SBU,kind:kindOf(k),id:idOf(k),data:cur[k],deleted:false,updated_at:S.u[k]||S.upd||Date.now()};
    else if(S.del[k])row={user_id:SBU,kind:kindOf(k),id:idOf(k),data:{},deleted:true,updated_at:S.del[k]};
    if(row){rows.push(row);sent[k]=row.updated_at}else delete S.dirty[k];
  });
  for(var i=0;i<rows.length;i+=200){
    var r=await SB.from('prumo_items').upsert(rows.slice(i,i+200),{onConflict:'user_id,kind,id'});
    if(r&&r.error)throw r.error;
  }
  Object.keys(sent).forEach(function(k){var now=(S.u[k]||0)>(S.del[k]||0)?S.u[k]:S.del[k];if(now===sent[k])delete S.dirty[k]});
}
function softRender(){
  var a=document.activeElement;
  if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&$('#view').contains(a)){pendRender=true;return}
  render();
}
async function syncNow(pull){
  if(!SB||!SBU)return;
  if(sbBusy){sbQ=Math.max(sbQ,pull?2:1);return}
  sbBusy=true;
  try{
    if(navigator.onLine===false){setSync('off');return}
    var changed=false;
    if(pull||!S.synced){changed=mergeRemote(await sbFetchAll());rebase()}
    await sbPush();
    setSync('ok');writeLocal();
    if(changed)softRender();
  }catch(e){
    setSync(navigator.onLine===false?'off':'err');
    clearTimeout(sbT);sbT=setTimeout(function(){syncNow(true)},30000);
  }
  finally{sbBusy=false}
  if(sbQ){var q=sbQ;sbQ=0;syncNow(q===2)}
}
function pullSoon(ms){clearTimeout(sbT);sbT=setTimeout(function(){syncNow(true)},ms)}
function pushSoon(ms){clearTimeout(sbPT);sbPT=setTimeout(function(){syncNow(false)},ms)}
function subscribeRT(){
  if(sbChan||!SBU)return;
  try{sbChan=SB.channel('prumo-items').on('postgres_changes',{event:'*',schema:'public',table:'prumo_items',filter:'user_id=eq.'+SBU},function(){pullSoon(500)}).subscribe()}catch(e){}
}
function startSync(){setSync('boot');syncNow(true).then(subscribeRT);pushRefresh()}
function stopSync(){if(sbChan){try{SB.removeChannel(sbChan)}catch(e){}sbChan=null}setSync('out')}
function initSB(){
  if(!SBCFG)return false;
  try{SB=window.supabase.createClient(SBCFG.url,SBCFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}})}

/* ---------- painel (analises) ---------- */
var revMode='rev',dashRange='week';
function periodList(mode){
  var out=[],i,td=todayISO();
  if(mode==='week'){
    var w0=weekStart(td);
    for(i=7;i>=0;i--){var a=addDays(w0,-7*i);out.push({from:a,to:addDays(a,6),label:parseISO(a).getDate()+' '+MONS[parseISO(a).getMonth()],cur:i===0})}
  }else{
    var n=new Date();
    for(i=5;i>=0;i--){var d=new Date(n.getFullYear(),n.getMonth()-i,1),e=new Date(d.getFullYear(),d.getMonth()+1,0);
      out.push({from:iso(d),to:iso(e),label:MONS[d.getMonth()],cur:i===0})}
  }
  return out;
}
function periodStats(p){
  var f=p.from,e=p.to,done=[],planned=0,slips=0,estSum=0,realSum=0,estReal=0,nReal=0;
  S.tasks.forEach(function(t){
    if(isGrp(t))return;
    if(t.day&&t.day>=f&&t.day<=e){planned++;slips+=t.slips||0}
    if(isDone(t)&&t.doneAt){var dd=iso(new Date(t.doneAt));if(dd>=f&&dd<=e){
      done.push(t);var est=t.est0||t.est;estSum+=est;
      if((t.focus||0)>=60){realSum+=t.focus/60;estReal+=est;nReal++}}}
  });
  var focus=0,d=f;while(d<=e){focus+=S.log[d]||0;d=addDays(d,1)}
  return {done:done.length,planned:planned,rate:planned?Math.round(done.length/planned*100):null,focus:focus/60,slips:slips,estSum:estSum,realSum:realSum,
    ratio:estReal?realSum/estReal:null,nReal:nReal};
}
function deltaHTML(cur,prev,unit,goodUp){
  if(prev==null||cur==null)return '';
  var d=cur-prev;if(Math.abs(d)<(unit==='min'?1:0.5))return '<small class="dl">igual ao anterior</small>';
  var up=d>0,good=goodUp?up:!up,txt=unit==='min'?(up?'+':'−')+fmt(Math.abs(d)):(up?'+':'−')+Math.round(Math.abs(d))+(unit==='pp'?' pp':'');
  return '<small class="dl" style="color:var('+(good?'--ok':'--warn')+')">'+txt+' vs. anterior</small>';
}
function barsHTML(ps,vals,fmtv,title){
  var mx=Math.max.apply(null,vals.concat([1]));
  return '<div class="bars" role="img" aria-label="'+esc(title)+'">'+ps.map(function(p,i){
    var v=vals[i],h=Math.max(v>0?4:0,Math.round(v/mx*100));
    return '<div class="bc"><span class="bv">'+(v>0?fmtv(v):'')+'</span><div class="bt"><i class="'+(p.cur?'cur':'')+'" style="height:'+h+'%"></i></div><span class="bl">'+esc(p.label)+'</span></div>'}).join('')+'</div>';
}
function calibText(r){
  if(r==null)return '';
  if(r<0.85)return 'Você costuma <b>superestimar</b>: leva cerca de '+Math.round(r*100)+'% do tempo que prevê.';
  if(r>1.15)return 'Você costuma <b>subestimar</b>: leva cerca de '+Math.round(r*100)+'% do tempo que prevê.';
  return 'Suas estimativas estão <b>bem calibradas</b> ('+Math.round(r*100)+'% do previsto).';
}
function viewPainel(){
  var ps=periodList(dashRange),st=ps.map(periodStats),cur=st[st.length-1],prev=st[st.length-2];
  var wk=dashRange==='week';
  var h='<header class="top"><div><div class="eyebrow">Revisão</div><h1 class="h1">Painel</h1></div></header>';
  h+='<div class="chips" style="margin-bottom:10px">'+chip('Revisão',false,'data-act="rev" data-v="rev"')+chip('Painel',true,'data-act="rev" data-v="dash"')+'</div>';
  h+='<div class="chips" style="margin-bottom:14px">'+chip('Por semana',wk,'data-act="drange" data-v="week"')+chip('Por mês',!wk,'data-act="drange" data-v="month"')+'</div>';
  var any=st.some(function(s){return s.done||s.focus});
  h+='<div class="cols"><div class="col">';

    '<div><b>'+cur.done+'</b><small>concluídas</small>'+deltaHTML(cur.done,prev.done,'n',true)+'</div>'+
    '<div><b>'+fmt(cur.focus)+'</b><small>em foco</small>'+deltaHTML(cur.focus,prev.focus,'min',true)+'</div>'+
    '<div><b>'+(cur.rate==null?'–':cur.rate+'%')+'</b><small>do planejado</small>'+deltaHTML(cur.rate,prev.rate,'pp',true)+'</div></div></section>';
  h+=secHTML('Concluídas por '+(wk?'semana':'mês'))+'<section class="panel">'+barsHTML(ps,st.map(function(s){return s.done}),function(v){return v},'Tarefas concluídas')+'</section>';
  h+=secHTML('Tempo em foco')+'<section class="panel">'+barsHTML(ps,st.map(function(s){return s.focus}),function(v){return v>=60?(Math.round(v/6)/10)+'h':Math.round(v)+'m'},'Minutos em foco')+'</section>';
  h+=secHTML('Taxa de conclusão')+'<section class="panel">'+barsHTML(ps,st.map(function(s){return s.rate||0}),function(v){return v+'%'},'Percentual do planejado concluído')+'<p class="hint" style="margin:0">Das tarefas com data no período, quantas você concluiu.</p></section>';
  if(!any)h+=emptyHTML('painel');

  // estimativa vs real
  var rs=S.tasks.filter(function(t){return isDone(t)&&!isGrp(t)&&(t.focus||0)>=60&&(t.est0||t.est)});
  var eT=sum(rs,function(t){return t.est0||t.est}),rT=sum(rs,function(t){return t.focus/60});
  h+=secHTML('Estimado contra real');

    h+='<section class="panel"><p style="margin:0">'+rs.length+' de 5 tarefas com tempo real registrado.</p><div class="bar"><i style="width:'+Math.round(rs.length/5*100)+'%;background:var(--accent)"></i></div><p class="hint" style="margin:0">Use o cronômetro até concluir a tarefa, ou preencha o tempo real ao editá-la. Com 5 tarefas, o app mostra se você costuma subestimar ou superestimar.</p></section>';
  }else{

    h+='<section class="panel"><p style="margin:0">'+calibText(rat)+'</p><div class="nums"><div><b>'+fmt(eT)+'</b><small>estimado</small></div><div><b>'+fmt(rT)+'</b><small>real</small></div><div><b>'+rs.length+'</b><small>tarefas</small></div></div>';
    var grp=function(name,f){var l=rs.filter(f);if(l.length<2)return '';var e=sum(l,function(t){return t.est0||t.est}),r=sum(l,function(t){return t.focus/60});return '<div class="rn2"><span>'+name+'</span><span>'+l.length+' · '+Math.round(r/e*100)+'%</span></div>'};
    var rows=CTX.map(function(c){return grp(esc(cname(c.id)),function(t){return t.ctx===c.id})}).join('')+
      grp('Até 30 min',function(t){return (t.est0||t.est)<=30})+grp('31 a 120 min',function(t){var e=t.est0||t.est;return e>30&&e<=120})+grp('Mais de 2h',function(t){return (t.est0||t.est)>120})+
      Object.keys(FW).map(function(k){return grp(esc(FW[k].name),function(t){return fwOf(t)===k})}).join('');
    if(rows)h+='<div><span class="lab">Real em relação ao estimado (tarefas · %)</span><div class="rn2s">'+rows+'</div></div>';
    h+='</section>';
    var last=rs.slice().sort(function(a,b){return (b.doneAt||0)-(a.doneAt||0)}).slice(0,6);
    h+=secHTML('Últimas tarefas')+'<div class="list">'+last.map(function(t){var e=t.est0||t.est,r=t.focus/60;return '<div class="row" style="display:block;padding:12px 16px"><div class="row-title">'+esc(t.title)+'</div><div class="row-meta"><span>estimado '+fmt(e)+'</span><span>real '+fmt(r)+'</span><span style="color:var('+(r>e*1.15?'--warn':'--ok')+')">'+(r>e*1.15?'+':(r<e*.85?'−':'≈'))+(Math.abs(Math.round((r/e-1)*100))>=15?Math.abs(Math.round((r/e-1)*100))+'%':'')+'</span></div></div>'}).join('')+'</div>';
  }
  var types={};S.tasks.forEach(function(t){if(t.type&&isDone(t)&&(t.focus||0)>=60){var o=types[t.type]=types[t.type]||{n:0,r:0,e:0};o.n++;o.r+=t.focus/60;o.e+=t.est0||t.est}});
  var tk=Object.keys(types);
  if(tk.length)h+=secHTML('Tempo por tipo de entrega')+'<section class="panel"><div class="rn2s">'+tk.map(function(k){var o=types[k];return '<div class="rn2"><span>'+esc(k)+' · '+o.n+'</span><span>média '+fmt(o.r/o.n)+' (estimado '+fmt(o.e/o.n)+')</span></div>'}).join('')+'</div></section>';
  var other=S.tasks.filter(function(t){return isDone(t)&&!isGrp(t)&&!((t.focus||0)>=60)}).length;
  if(other)h+='<p class="hint" style="margin-top:10px">'+other+' tarefa'+(other>1?'s':'')+' concluída'+(other>1?'s':'')+' sem tempo real. Elas contam nas entregas, mas não na comparação de estimativa.</p>';
  h+='<p class="hint" style="margin-top:10px">Os dados ficam guardados por 400 dias para você comparar meses.</p>';
  h+='</div></div>';
  return h;
}

function planDays(start,n,wk){
  var out=[],d=start||todayISO(),guard=0;
  while(out.length<n&&guard++<400){var w=parseISO(d).getDay();if(!wk||(w!==0&&w!==6))out.push(d);d=addDays(d,1)}
  return out;
}
function mkKids(t,name,n,est,days,type){
  var have=S.tasks.filter(function(c){return c.parent===t.id&&c.type===(type||name)}).length;
  if(days)n=days.length;
  for(var i=1;i<=n;i++)S.tasks.push({id:uid(),title:(n>1||have)?name+' '+(have+i):name,type:type||name,parent:t.id,ctx:t.ctx,est:est,est0:est,day:days?days[i-1]:(t.day||null),status:'todo',fw:null,urg:!!t.urg,imp:!!t.imp,dod:[],mit:false,slips:0,focus:0,pomos:0,created:Date.now(),ex:false});
}
function addKids(){
  var g=sh.g||{},name=(g.name||'').trim(),n=Math.max(1,Math.min(20,Math.round(Number(g.n)||1))),est=Math.round(Number(g.est)||0);
  if(!name){toast('Dê um nome à entrega.');return}
  if(!(est>=1&&est<=960)){toast('Informe os minutos de cada entrega.');return}
  sh.g={name:'',n:'1',est:''};
  if(sh.mode==='new'){sh.pend=sh.pend||[];sh.pend.push({name:name,n:n,est:est});renderSheet();return}
  var t=byId(sh.id);if(!t)return;
  mkKids(t,name,n,est);
  t.day=null;sh.d.day=null;
  persist();renderSheet();render();toast(n+' entrega'+(n>1?'s':'')+' adicionada'+(n>1?'s':'')+'.');
}
function addPlan(){
  var g=sh.g||{},n=Math.round(Number(g.pn)||0),est=Math.round(Number(g.pest)||0),wk=g.pwk!==false,start=g.pstart||todayISO();
  if(!(n>=1&&n<=60)){toast('Informe quantos dias, de 1 a 60.');return}
  if(!(est>=1&&est<=960)){toast('Informe os minutos por dia.');return}
  var days=planDays(start,n,wk);
  sh.g={name:'',n:'1',est:'',pstart:start,pn:'',pest:'',pwk:wk};
  if(sh.mode==='new'){sh.pend=sh.pend||[];sh.pend.push({name:'Sessão',n:n,est:est,days:days,plan:true});renderSheet();return}
  var t=byId(sh.id);if(!t)return;
  mkKids(t,'Sessão',n,est,days,t.title);
  t.day=null;sh.d.day=null;t.est=sum(kidsOf(t.id),function(c){return c.est});sh.d.est=t.est;
  persist();renderSheet();render();toast('Plano criado: '+n+' dias de '+fmt(est)+'.');
}

function recLabel(r){
  if(!r)return 'Não repete';
  if(r.t==='daily')return 'Todo dia';
  if(r.t==='weekdays')return 'Dias úteis';
  if(r.t==='monthly')return 'Todo mês';
  var n=(r.dows||[]).slice().sort(function(a,b){return ((a+6)%7)-((b+6)%7)}).map(function(x){return DABR[x]});
  return 'Toda '+(n.join(', ')||'semana');
}
function recMatch(s,d){
  if(d<s.start)return false;if(s.until&&d>s.until)return false;if((s.skip||[]).indexOf(d)>=0)return false;
  var p=parseISO(d),w=p.getDay(),r=s.rule||{};
  if(r.t==='daily')return true;
  if(r.t==='weekdays')return w>0&&w<6;
  if(r.t==='weekly')return (r.dows||[]).indexOf(w)>=0;
  if(r.t==='monthly'){var sd=parseISO(s.start).getDate(),last=new Date(p.getFullYear(),p.getMonth()+1,0).getDate();return p.getDate()===Math.min(sd,last)}
  return false;
}
function topUpRec(){
  var made=0,td=todayISO();
  Object.keys(S.rec||{}).forEach(function(id){
    var s=S.rec[id];if(!s||!s.rule)return;
    for(var i=0;i<14;i++){
      var d=addDays(td,i);if(!recMatch(s,d))continue;
      if(S.tasks.some(function(t){return t.rid===id&&(t.od||t.day)===d}))continue;
      S.tasks.push({id:'r_'+id+'_'+d,rid:id,od:d,title:s.title,ctx:s.ctx,est:s.est,est0:s.est,day:d,status:'todo',fw:s.fw||null,urg:!!s.urg,imp:!!s.imp,
        dod:(s.dodText||'').split('\n').map(function(x){return x.trim()}).filter(Boolean).slice(0,12).map(function(x){return {t:x,d:false}}),mit:false,slips:0,focus:0,pomos:0,created:Date.now(),ex:false});
      made++;
    }
  });
  return made;
}
function rolloverRec(){try{if(topUpRec())persist()}catch(e){}}
function purgeFuture(rid,od){S.tasks=S.tasks.filter(function(x){return !(x.rid===rid&&!isDone(x)&&(x.od||x.day)>od)})}
function applyRec(t,d){
  if(t.parent||isGrp(t)||d.parent)return;
  var s=t.rid&&S.rec[t.rid],want=d.rec||null,od=t.od||t.day;
  var dod=function(){return (d.dodText||'').split('\n').map(function(x){return x.trim()}).filter(Boolean).slice(0,12)};
  if(!s&&want){
    if(!t.day)t.day=todayISO();
    if(want.t==='weekly'&&(!want.dows||!want.dows.length))want={t:'weekly',dows:[parseISO(t.day).getDay()]};
    var rid=uid();
    S.rec[rid]={id:rid,title:t.title,ctx:t.ctx,est:t.est,fw:t.fw||null,urg:!!t.urg,imp:!!t.imp,dodText:dod().join('\n'),rule:want,start:t.day,until:null,skip:[]};
    t.rid=rid;t.od=t.day;
  }else if(s&&!want){
    s.until=od;purgeFuture(t.rid,od);delete t.rid;delete t.od;
  }else if(s&&want){
    if(JSON.stringify(s.rule)!==JSON.stringify(want)){s.rule=want;purgeFuture(t.rid,od)}
    if(d.recAll){
      s.title=t.title;s.ctx=t.ctx;s.est=t.est;s.fw=t.fw||null;s.urg=!!t.urg;s.imp=!!t.imp;s.dodText=dod().join('\n');
      S.tasks.forEach(function(x){if(x.rid===t.rid&&x.id!==t.id&&!isDone(x)&&(x.od||x.day)>od){x.title=s.title;x.ctx=s.ctx;x.est=s.est;x.fw=s.fw;x.urg=s.urg;x.imp=s.imp;x.dod=dod().map(function(l){return {t:l,d:false}})}});
    }
  }
}
function endSeries(id){
  var t=byId(id);if(!t||!t.rid||!S.rec[t.rid]){dropTask(id);return}
  var rid=t.rid,s=S.rec[rid],od=t.od||t.day,prev=s.until,gone=S.tasks.filter(function(x){return x.rid===rid&&!isDone(x)&&(x.od||x.day)>=od});
  s.until=addDays(od,-1);
  S.tasks=S.tasks.filter(function(x){return gone.indexOf(x)<0});
  if(S.session&&gone.some(function(g){return g.id===S.session.tid})){S.session=null;unlock()}
  persist();render();
  toast('Repetição encerrada.','Desfazer',function(){s.until=prev;gone.forEach(function(x){S.tasks.push(x)});persist();render()});
}

function planSheetHTML(){
  var wk=curWk();
  var h='<div class="sh-head"><h2 class="h2">Planejar a semana</h2><button class="ib" data-act="sh-close" aria-label="Fechar">'+ic('x')+'</button></div>';

    case 'drop':dropTask(id);break;
    case 'clear-ex':S.tasks=S.tasks.filter(function(t){return !t.ex});if(S.session&&!byId(S.session.tid)&&S.session.tid){S.session=null;unlock()}persist();render();toast('Exemplos removidos. Agora é com você.');break;
    case 'wk':{var d=Number(el.dataset.d);wkOff=d===0?0:wkOff+d;selDay=null;render();break}
    case 'selday':selDay=el.dataset.d;render();break;
    case 'pull':{var p=byId(id);if(p){p.day=selDay||todayISO();persist();render();toast('Puxada para '+shortDate(p.day)+'.')}break}
    case 'plan':sh={kind:'plan'};renderSheet();break;
    case 'cap':{var i=Number(el.dataset.i),dl=Number(el.dataset.d);S.cap[i]=Math.max(0,Math.min(720,(S.cap[i]||0)+dl));persist();renderSheet();render();break}
    case 'autoplan':autoPlan();break;
    case 'push-later':try{localStorage.setItem('prumo.pushno','1')}catch(e){}render();break;
    case 'brief':try{localStorage.setItem('prumo.brief',el.dataset.v)}catch(e){}remSig='';if(el.dataset.v==='off'&&SB&&SBU)SB.from('prumo_reminders').delete().eq('user_id',SBU).eq('sent',false).then(function(){},function(){});else remSync();render();break;
    case 'push-check':pushState='boot';pushRefresh();break;
    case 'push-on':pushEnable();break;
    case 'push-off':pushDisable();break;
    case 'push-test':pushTest();break;
    case 'sh-par':sh.d.parent=el.dataset.v||null;renderSheet();break;
    case 'plan-add':addPlan();break;
    case 'plan-wk':sh.g=sh.g||{};sh.g.pwk=sh.g.pwk===false;renderSheet();break;
    case 'kid-add':addKids();break;
    case 'kid-open':{if(sh&&sh.mode==='edit'&&sh.d.title.trim()){var ct=byId(sh.id);if(ct){applySheet(ct,sh.d);persist()}}openTask(el.dataset.id);break}
    case 'rev':revMode=el.dataset.v;render();scrollTop();break;
    case 'drange':dashRange=el.dataset.v;render();break;
    case 'rowdel':dropTask(el.dataset.id);break;
    case 'sh-close':if(sh&&sh.kind==='help'&&helpPrev){sh=helpPrev;helpPrev=null}else sh=null;renderSheet();break;
    case 'sh-save':saveTask();break;
    case 'sh-del':{var tt=sh.mode==='edit'&&byId(sh.id);if(tt&&tt.rid&&S.rec[tt.rid]){sh.del=!sh.del;renderSheet()}else if(!sh.del){sh.del=true;renderSheet()}else{var did=sh.id;sh=null;renderSheet();dropTask(did)}break}
    case 'sh-usesug':sh.d.fw=null;renderSheet();break;
    case 'sh-more':sh.more=true;renderSheet();break;
    case 'sh-sec':sh.sec=sh.sec===el.dataset.v?null:el.dataset.v;renderSheet();break;
    case 'sh-est-other':sh.estOpen=true;renderSheet();setTimeout(function(){var i=$('#f-est');if(i)i.focus()},40);break;
    case 'sh-rec':{var v=el.dataset.v;if(v==='none')sh.d.rec=null;else if(v==='weekly')sh.d.rec={t:'weekly',dows:(sh.d.rec&&sh.d.rec.t==='weekly'&&sh.d.rec.dows&&sh.d.rec.dows.length)?sh.d.rec.dows:[parseISO(sh.d.day||todayISO()).getDay()]};else sh.d.rec={t:v};renderSheet();break}
    case 'rec-dow':{var w=Number(el.dataset.v),ds=(sh.d.rec&&sh.d.rec.dows||[]).slice(),ix=ds.indexOf(w);if(ix>=0){if(ds.length>1)ds.splice(ix,1)}else ds.push(w);sh.d.rec.dows=ds;renderSheet();break}
    case 'rec-all':sh.d.recAll=!sh.d.recAll;renderSheet();break;
    case 'sh-del1':{var d1=sh.id;sh=null;renderSheet();dropTask(d1);break}
    case 'sh-delall':{var d2=sh.id;sh=null;renderSheet();endSeries(d2);break}
    case 'help':helpPrev=(sh&&sh.kind==='task')?sh:null;sh={kind:'help'};renderSheet();break;
    case 'pw-open':sh={kind:'pw'};renderSheet();break;
    case 'pw-save':savePw();break;
    case 'sh-ctx':sh.d.ctx=el.dataset.v;renderSheet();break;
    case 'sh-day':sh.d.day=el.dataset.v==='none'?null:el.dataset.v;renderSheet();break;
    case 'sh-est':sh.d.est=Number(el.dataset.v);sh.estOpen=false;renderSheet();break;
    case 'sh-urg':sh.d.urg=!sh.d.urg;renderSheet();break;
    case 'sh-imp':sh.d.imp=!sh.d.imp;renderSheet();break;
    case 'sh-fw':sh.d.fw=el.dataset.v;renderSheet();break;
    case 'pause':{var se=S.session;if(se&&se.running){se.left=remaining();se.running=false;se.endsAt=null;unlock();persist();render()}break}
    case 'resume':{var s2=S.session;if(s2&&!s2.running){ensureAudio();s2.endsAt=Date.now()+s2.left*1000;s2.running=true;lock();persist();render()}break}
    case 'plus':{var s3=S.session;if(s3){s3.total+=300;if(s3.running)s3.endsAt+=300000;else s3.left+=300;persist();tick()}break}
    case 'finish':finishSession();break;
    case 'stop':settleFocus();S.session=null;unlock();persist();render();break;
    case 'next-break':{var s4=S.session;if(s4)startPhase('break',(s4.pomos%4===0?15:5)*60);break}
    case 'next-focus':{var s5=S.session;if(s5)startPhase('focus',focusSecs(s5.fw,s5.tid?byId(s5.tid):null));break}
    case 'more':{var s6=S.session;if(s6)startPhase('focus',(s6.fw==='dois'?2:10)*60);break}
    case 'cont25':{var s7=S.session;if(s7){s7.fw='pomodoro';startPhase('focus',1500)}break}
    case 'dod':{var dt=byId(id);if(dt&&dt.dod[Number(el.dataset.i)]){var x=dt.dod[Number(el.dataset.i)];x.d=!x.d;persist();render()}break}
    case 'pip':openPip();break;
    case 'pip-auto':try{localStorage.setItem('prumo.pip',pipAuto()?'off':'on')}catch(e){}render();break;
    case 'notif':try{Notification.requestPermission().then(function(){render()})}catch(e){}break;
    case 'lock':if(window.prumoLock)window.prumoLock();break;
    case 'copy-summary':copyText(summaryText(),'Resumo copiado.');break;
    case 'copy-backup':copyText(JSON.stringify(Object.assign({},S,{session:null})),'Backup copiado.');break;
    case 'restore':{
      try{var o=JSON.parse(restoreTxt);if(!o||!Array.isArray(o.tasks))throw 0;S=Object.assign(blank(),o,{session:null},{u:S.u,dirty:S.dirty,del:S.del,synced:S.synced});restoreTxt='';persist();render();toast('Backup restaurado.')}
      catch(e){toast('Esse texto não parece um backup do Prumo.')}
      break}
    case 'toast-act':{var fn=toastFn;toastFn=null;$('#toast').hidden=true;if(fn)fn();break}
  }
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  act(el.dataset.act,el);
});
document.addEventListener('input',function(e){
  var el=e.target,k=el.dataset&&el.dataset.in;if(!k)return;
  if(k==='title'||k==='dodText'){if(sh&&sh.d)sh.d[k]=el.value}
  else if(k==='gname'||k==='gn'||k==='gest'||k==='pstart'||k==='pn'||k==='pest'){if(sh){sh.g=sh.g||{name:'',n:'1',est:''};sh.g[{gname:'name',gn:'n',gest:'est',pstart:'pstart',pn:'pn',pest:'pest'}[k]]=el.value}}
  else if(k==='real'){if(sh&&sh.d)sh.d.real=el.value}
  else if(k==='blk'){var td=todayISO();if(el.value.trim())S.blockers[td]=el.value;else delete S.blockers[td];persist()}
  else if(k==='retro'){var wk=curWk();S.retro[wk]=S.retro[wk]||{};S.retro[wk][el.dataset.f]=el.value;persist()}
  else if(k==='ctxname'){S.ctx=S.ctx||{};var v=el.value.trim();if(v)S.ctx[el.dataset.c]=v;else delete S.ctx[el.dataset.c];persist()}
  else if(k==='restore'){restoreTxt=el.value}
  else if(k==='est'){var n=Math.round(Number(el.value));if(n>=1&&n<=960&&sh&&sh.d){sh.d.est=n;Array.prototype.forEach.call(document.querySelectorAll('[data-act="sh-est"]'),function(b){b.setAttribute('aria-pressed',String(Number(b.dataset.v)===n))});var pn=document.getElementById('pomo-n');if(pn)pn.textContent=pomoText(sh.d,sh.d.fw||suggestFw(sh.d));var sb=document.getElementById('sug-box');if(sb)sb.innerHTML=sugInner(sh.d);var cf=sh.d.fw||suggestFw(sh.d);Array.prototype.forEach.call(document.querySelectorAll('[data-act="sh-fw"]'),function(b){b.setAttribute('aria-pressed',String(b.dataset.v===cf))})}}
});
document.addEventListener('change',function(e){
  var el=e.target;if(el.dataset&&el.dataset.in==='date'&&sh&&sh.d){sh.d.day=el.value||null;renderSheet()}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&sh){sh=null;renderSheet()}
  if(e.key==='Enter'&&e.target&&e.target.id==='f-title'){e.preventDefault();saveTask()}
  if(e.key==='Enter'&&e.target&&e.target.id==='blk'){e.target.blur()}
});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'){lock();tick();pullRemote();if(SBU)syncNow(true);rolloverRec()}
});

document.addEventListener('keydown',function(e){
  var t=e.target,tag=t&&t.tagName;
  if(e.metaKey||e.ctrlKey||e.altKey||sh)return;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable))return;
  var g=document.getElementById('gate');if(g&&!g.hidden)return;
  var k=e.key;
  if(k==='n'||k==='N'){e.preventDefault();act('new',{dataset:{}})}
  else if(k==='1'||k==='2'||k==='3'||k==='4'){var TT=['hoje','semana','foco','revisao'];act('tab',{dataset:{t:TT[Number(k)-1]}})}
  else if(k===' '&&tag!=='BUTTON'&&S.session&&!S.session.alerted){e.preventDefault();act(S.session.running?'pause':'resume',{dataset:{}})}
});

/* ---------- boot ---------- */
async function boot(){
  prune(400);S.rec=S.rec||{};
  initSB();
  rebase();
  rolloverRec();
  initNav();
  if(S.session)tab='foco';
  render();
  var tw=null;
  try{tw=new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(1)},500)'],{type:'text/javascript'})));tw.onmessage=function(){tick()}}catch(e){tw=null}
  if(!tw)setInterval(tick,250);
  await Promise.race([initRemote(),new Promise(function(r){setTimeout(r,4500)})]);
  booted=true;
  if(!S.seeded&&!S.tasks.length)seed();
  render();
  tick();
  try{if(/[?&]retro=1/.test(location.search)){history.replaceState(null,'',location.pathname);wrOpen(weekStart(todayISO()))}}catch(e){}
  try{navigator.serviceWorker.addEventListener('message',function(e){if(e.data&&e.data.go==='retro')wrOpen(weekStart(todayISO()))})}catch(e){}
}
boot();
})();
</script>
